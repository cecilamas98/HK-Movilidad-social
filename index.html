<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movilidad Social · GEB</title>
<style>
:root{
  --cream:#F7F3E6;
  --cream-2:#F0E9D6;
  --paper:#FFFFFF;
  --ink:#28211C;
  --ink-soft:#6B6255;
  --ink-faint:#9A9184;
  --dark-blue:#1A1AA7;
  --dark-blue-2:#131385;
  --orange:#FFA142;
  --sky-blue:#B1D5F0;
  --sky-blue-deep:#3E8FD1;
  --neon-yellow:#E3F40C;
  --neon-yellow-deep:#B9C700;
  --coffee:#28211C;
  /* alias de compatibilidad con nombres previos, ahora mapeados a la identidad Café del Alma */
  --gold-1:#FFA142;
  --gold-2:#FFB768;
  --violet-1:var(--dark-blue-2);
  --violet-2:var(--dark-blue);
  --teal:#2FA37A;
  --teal-2:#4FC79B;
  --text:var(--ink);
  --text-2:var(--ink-soft);
  --text-3:var(--ink-faint);
  --verde:#3E9B6B;
  --ambar:#D98B1E;
  --rojo:#D3453A;
  --gris:#8A8074;
  --azul:#3E8FD1;
  --lila:#8B7FD6;
  --radius:18px;
  --radius-sm:10px;
  --font-display:'Space Grotesk','Poppins','Nunito','Segoe UI',ui-rounded,system-ui,sans-serif;
  --font-body:'Space Grotesk','Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --border:rgba(40,33,28,0.10);
  --border-2:rgba(40,33,28,0.20);
  --card-bg:#FFFFFF;
  --card-bg-2:#F3EEDF;
  /* colores de los 8 pilares */
  --p1:#1A1AA7; --p1-ink:#FFFFFF;
  --p2:#3E8FD1; --p2-ink:#FFFFFF;
  --p3:#FFA142; --p3-ink:#28211C;
  --p4:#28211C; --p4-ink:#FFFFFF;
  --p5:#C7D400; --p5-ink:#28211C;
  --p6:#FF6B5B; --p6-ink:#FFFFFF;
  --p7:#7B7FE0; --p7-ink:#FFFFFF;
  --p8:#2FA37A; --p8-ink:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 8% -10%, rgba(26,26,167,0.05), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,161,66,0.09), transparent 55%),
    radial-gradient(ellipse 600px 400px at 50% 100%, rgba(227,244,12,0.07), transparent 60%),
    var(--cream);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:var(--font-display);}
button,input,select,textarea{font-family:inherit;color:inherit;}
a{color:var(--dark-blue);}
::selection{background:var(--neon-yellow);color:var(--ink);}

:focus-visible{outline:2px solid var(--dark-blue);outline-offset:2px;border-radius:6px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}

/* ---------- layout shell ---------- */
#app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(247,243,230,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  margin:0 -20px 28px;
}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:600;}
.brand .title{font-size:19px;font-weight:700;color:var(--dark-blue);}
.nav{display:flex;gap:6px;flex-wrap:wrap;}
.nav button{
  background:transparent;border:1px solid transparent;color:var(--text-2);
  padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.nav button:hover{color:var(--text);background:var(--card-bg-2);}
.nav button.active{color:#fff;background:var(--dark-blue);border-color:transparent;}
.topbar-actions{display:flex;gap:8px;}
.btn{
  border:1px solid var(--border-2);background:var(--card-bg);color:var(--text);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:var(--card-bg-2);border-color:var(--border-2);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--dark-blue);border-color:transparent;color:#fff;}
.btn-primary:hover{filter:brightness(1.12);}
.btn-gold{background:var(--orange);border-color:transparent;color:var(--ink);}
.btn-gold:hover{background:#ff9a2e;}
.btn-ghost{background:transparent;border-color:var(--border-2);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- generic ---------- */
.card{
  background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:0 8px 24px rgba(40,33,28,0.07);
}
.card + .card{margin-top:16px;}
.section-title{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin:0 0 12px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;}}
label{font-size:12.5px;color:var(--text-2);display:block;margin-bottom:5px;font-weight:600;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--border-2);
  border-radius:10px;padding:9px 11px;font-size:14px;color:var(--text);
}
textarea{resize:vertical;min-height:90px;}
input::placeholder,textarea::placeholder{color:var(--text-3);}
.field{margin-bottom:12px;}
.chip{
  display:inline-flex;align-items:center;gap:8px;background:var(--card-bg-2);
  border:1px solid var(--border-2);border-radius:999px;padding:6px 8px 6px 14px;font-size:12.5px;color:var(--text);
}
.chip .pri{width:7px;height:7px;border-radius:50%;flex:none;}
.pri-critica{background:var(--rojo);}
.pri-estrategica{background:var(--ambar);}
.pri-evolutiva{background:var(--azul);}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:2px 8px;border-radius:6px;}
.tag-nueva{background:rgba(47,163,122,0.15);color:#1f7a5c;border:1px solid rgba(47,163,122,0.4);}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
.badge-gris{background:rgba(138,128,116,0.16);color:#6B6255;}
.badge-azul{background:rgba(62,143,209,0.16);color:#25679e;}
.badge-verde{background:rgba(62,155,107,0.16);color:#256b48;}
.badge-ambar{background:rgba(217,139,30,0.16);color:#9c650f;}
.badge-rojo{background:rgba(211,69,58,0.14);color:#a8291f;}
.badge-lila{background:rgba(139,127,214,0.16);color:#5b4fb8;}
.badge-naranja{background:rgba(255,161,66,0.22);color:#a15a10;}
.hr{height:1px;background:var(--border);margin:16px 0;border:0;}
.muted{color:var(--text-2);}
.small{font-size:12.5px;}
.empty{padding:30px 16px;text-align:center;color:var(--text-2);border:1px dashed var(--border-2);border-radius:var(--radius-sm);}
.row{display:flex;align-items:center;gap:10px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.checkbox{
  width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-2);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:var(--paper);
}
.checkbox.done{background:var(--teal);border-color:transparent;}
.checkbox.done::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
.task-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
.task-row:last-child{border-bottom:none;}
.task-title{font-size:14.5px;flex:1;}
.task-title.done{color:var(--text-3);text-decoration:line-through;}
.task-meta{font-size:11.5px;color:var(--text-2);display:flex;gap:8px;align-items:center;}
.iconbtn{background:transparent;border:none;color:var(--text-3);cursor:pointer;padding:4px;border-radius:6px;font-size:15px;line-height:1;}
.iconbtn:hover{color:var(--rojo);background:rgba(211,69,58,0.1);}

/* progress bar */
.barwrap{background:var(--card-bg-2);border-radius:999px;height:14px;overflow:hidden;position:relative;}
.barfill{height:100%;border-radius:999px;background:var(--orange);transition:width .4s ease;}
.barfill.over{background:var(--rojo);}
.overload-label{color:var(--rojo);font-weight:700;font-size:13px;margin-top:8px;}

/* pillar list (Presentación / Indicadores) */
.pilar-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:var(--paper);}
.pilar-card.p8{border-color:rgba(47,163,122,0.4);background:linear-gradient(135deg,rgba(47,163,122,0.08),rgba(26,26,167,0.04));}
.pilar-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.pilar-name{font-weight:700;font-size:14.5px;}
.pilar-pct{font-family:var(--font-display);font-weight:700;font-size:19px;}

/* selector de pilares con color (Semana) */
.pilar-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:820px){.pilar-picker{grid-template-columns:repeat(4,1fr);}}
.pilar-swatch{
  border:none;border-radius:14px;padding:14px 12px;cursor:pointer;text-align:left;
  color:var(--swatch-ink);background:var(--swatch-color);position:relative;overflow:hidden;
  transition:transform .12s,box-shadow .12s;box-shadow:0 4px 12px rgba(40,33,28,0.08);
}
.pilar-swatch:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(40,33,28,0.16);}
.pilar-swatch.open{outline:3px solid var(--ink);outline-offset:2px;}
.pilar-swatch .pid{font-family:var(--font-display);font-weight:700;font-size:16px;display:block;}
.pilar-swatch .pname{font-size:11.5px;opacity:.9;display:block;margin-top:2px;line-height:1.25;}
.pilar-swatch .pcount{position:absolute;top:10px;right:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,0.28);padding:2px 8px;border-radius:999px;}
.pilar-panel{border-radius:var(--radius-sm);padding:16px;margin-top:12px;border:2px solid var(--panel-color);background:var(--paper);}
.pilar-panel .panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pilar-panel .dot{width:12px;height:12px;border-radius:50%;background:var(--panel-color);flex:none;}
.activity-chip{
  display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:8px 10px;font-size:12.5px;
  background:var(--paper);border:1.5px solid var(--panel-color);color:var(--ink);cursor:grab;margin:0 8px 8px 0;
}
.activity-chip:active{cursor:grabbing;}
.activity-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--panel-color);flex:none;}
.nueva-row{
  display:flex;align-items:center;gap:8px;border-radius:10px;padding:6px 6px 6px 12px;margin:0 0 8px 0;
  background:var(--card-bg-2);border:1.5px dashed var(--panel-color);
}
.nueva-row input{border:none;background:transparent;padding:4px 2px;font-size:12.5px;}
.nueva-row input:focus{outline:none;}

/* tarjetas por pilar — vista Mes (mobile-first: 1 col base, crece con el viewport) */
.pilar-mes-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:600px){.pilar-mes-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1000px){.pilar-mes-grid{grid-template-columns:repeat(4,1fr);}}
.pilar-mes-card{
  border:none;border-radius:16px;padding:16px;text-align:left;cursor:pointer;
  background:var(--card-color);color:var(--card-ink);
  box-shadow:0 4px 14px rgba(40,33,28,0.12);transition:transform .12s,box-shadow .12s;
  font-family:var(--font-body);width:100%;
}
.pilar-mes-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(40,33,28,0.2);}
.pilar-mes-card.open{outline:3px solid var(--ink);outline-offset:2px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.94);color:var(--ink);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.ventaja-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.26);border-radius:999px;padding:3px 10px 3px 7px;font-size:11px;font-weight:700;margin-top:6px;}
.ventaja-feature{display:flex;align-items:center;gap:12px;background:var(--card-bg-2);border-left:4px solid var(--panel-color);border-radius:12px;padding:12px 14px;margin:12px 0 16px;}
.ventaja-feature-icon{width:38px;height:38px;border-radius:50%;background:var(--panel-color);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}

/* semáforo visual por objetivo táctico */
.semaforo-chip{
  border:none;border-radius:12px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;opacity:.85;transition:opacity .12s,transform .12s;
}
.semaforo-chip:hover{opacity:1;transform:translateY(-1px);}
.semaforo-chip.active{opacity:1;outline:2px solid var(--ink);outline-offset:1px;}
.semaforo-chip b{font-size:15px;}
.objetivo-row{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.objetivo-row-head{
  width:100%;background:var(--paper);border:none;padding:10px 12px;cursor:pointer;
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);text-align:left;
}
.objetivo-row-head:hover{background:var(--card-bg-2);}
.objetivo-actions{background:var(--card-bg-2);padding:8px 14px;border-top:1px solid var(--border);}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border-2);font-weight:700;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:var(--card-bg-2);}
td input[type=number]{width:78px;padding:5px 7px;}
.tbl-wrap{overflow-x:auto;}

/* week grid */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;}
.day-col{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;min-height:160px;background:var(--paper);transition:background .12s,border-color .12s;}
.day-col.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset;}
.day-col.drag-over{background:var(--card-bg-2);border-color:var(--dark-blue);box-shadow:0 0 0 2px var(--dark-blue) inset;}
.day-head{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px;text-transform:capitalize;}
.day-head b{color:var(--text);}
.mini-task{background:var(--card-bg-2);border-radius:8px;padding:7px 8px;font-size:12px;margin-bottom:6px;border-left:3px solid var(--mini-color,var(--border-2));}
.mini-task select{margin-top:5px;font-size:11px;padding:4px 6px;}
.prog-mes-headrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px;}
.prog-mes-headcell{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;text-align:center;}
.prog-mes-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px;}
.day-col-compact{min-height:64px;padding:8px;}
.day-col-compact .day-head{margin-bottom:4px;font-size:11px;}
.day-col-compact .mini-task{padding:5px 6px;margin-bottom:4px;font-size:11px;}

/* slides */
.slide{padding:46px 6px;border-bottom:1px dashed var(--border);}
.slide:last-child{border-bottom:none;}
.slide-eyebrow{font-size:12px;color:var(--orange);text-transform:uppercase;letter-spacing:.14em;font-weight:700;margin-bottom:10px;}
.slide h2{font-size:clamp(22px,3vw,32px);margin:0 0 18px;}
.slide-cover{text-align:center;padding:80px 6px;}
.slide-cover .title{font-size:clamp(30px,5vw,46px);color:var(--dark-blue);font-weight:700;margin:14px 0;}

/* map */
.mapa-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:900px){.mapa-wrap{grid-template-columns:1fr;}}
.mapa-svg{width:100%;height:auto;}
.mapa-node circle{fill:var(--dark-blue);stroke:rgba(255,255,255,0.5);stroke-width:1;filter:drop-shadow(0 6px 14px rgba(40,33,28,0.18));cursor:pointer;transition:transform .15s;}
.mapa-node.pilar circle{fill:var(--node-color,var(--orange));}
.mapa-node.p8 circle{fill:var(--p8);}
.mapa-node:hover circle{transform:scale(1.06);transform-origin:center;}
.mapa-node.active circle{stroke:var(--ink);stroke-width:2.5;}
.mapa-node text{fill:#fff;font-size:10.5px;font-family:var(--font-body);pointer-events:none;text-anchor:middle;}
.mapa-node.pilar text, .mapa-node.p8 text{fill:#fff;}
.mapa-line{stroke:rgba(40,33,28,0.18);stroke-width:1.2;}
.mapa-line.active{stroke:var(--dark-blue);stroke-width:1.8;}
.mapa-center circle{fill:var(--paper);stroke:var(--border-2);stroke-width:1.4;}
.mapa-center text{fill:var(--text);font-family:var(--font-display);font-weight:700;font-size:13px;text-anchor:middle;}
.mapa-center .sub{fill:var(--text-2);font-family:var(--font-body);font-weight:400;font-size:10px;}
.mapa-side{margin-top:14px;}

/* filters */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filterbar select{width:auto;padding:7px 10px;font-size:12.5px;}
.toggle{
  background:var(--card-bg);border:1px solid var(--border-2);border-radius:999px;padding:6px 13px;
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-2);
}
.toggle.on{background:var(--dark-blue);color:#fff;border-color:transparent;}

.hidden{display:none !important;}

footer.appfoot{text-align:center;color:var(--text-3);font-size:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border);}


@media print{
  .topbar,.no-print{display:none !important;}
  body{background:#fff;color:#111;}
  #app{max-width:100%;padding:0;}
  .slide{page-break-after:always;padding:20px 0;border-bottom:none;}
  .card{box-shadow:none;border-color:#ccc;}
  .slide-cover .title{color:#1A1AA7;}
}
@media(max-width:640px){
  .grid-3{grid-template-columns:1fr;}
  .topbar-inner{flex-direction:column;align-items:flex-start;}
  .nav{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;}
  .pilar-picker{grid-template-columns:repeat(2,1fr);}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<div id="app"></div>

<script>
'use strict';

/* =========================================================
   UTILIDADES
   ========================================================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function monthKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function startOfWeek(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addMonths(monthKeyStr,n){ const [y,m]=monthKeyStr.split('-').map(Number); const d=new Date(y,m-1+n,1); return monthKey(d); }
function monthLabel(monthKeyStr){
  const [y,m]=monthKeyStr.split('-').map(Number);
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return meses[m-1]+' '+y;
}
function dayLabel(d){
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  return dias[d.getDay()];
}

function downloadFile(filename, content, type){
  const blob = new Blob([content], {type: type||'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

    background:${isError?'#D3453A':'#1A1AA7'};color:#fff;padding:12px 20px;border-radius:12px;

}

/* Conversión de frecuencia a horas mensuales / semanales */
function horasMensuales(act){
  const h = Number(act.horas)||0;
  switch(act.frecuencia){
    case 'Semanal': return h*4.33;
    case 'Mensual': return h*1;
    case 'Trimestral': return h/3;
    case 'Semestral': return h/6;
    case 'Anual': return h/12;
    case 'Por caso':
    case 'Por proceso': return h;
    default: return h;
  }
}
function horasSemanales(act){ return horasMensuales(act)/4.33; }

  const out = {Crítica:0,Estratégica:0,Evolutiva:0};
  state.actividades.forEach(a=>{ out[a.prioridad] = (out[a.prioridad]||0) + horasMensuales(a); });
  return out;
}
function cargaCatalogoPorPilar(){
  const out = {};
  state.actividades.forEach(a=>{ out[a.pilar] = (out[a.pilar]||0) + horasMensuales(a); });
  return out;
}
function chipsActividadesSemana(){
  // semanales siempre; mensuales solo primera semana del mes (heurística: hoy.day<=7 dentro de la semana mostrada)
  return state.actividades.filter(a=>a.frecuencia==='Semanal');
}
function chipsActividadesMensuales(refDate){
  if(refDate.getDate()>7) return [];
  return state.actividades.filter(a=>a.frecuencia==='Mensual');
}
function tareasDelDia(mk, fechaISO){
  return getTareas(mk).filter(t=>t.fecha===fechaISO);
}
function horasComprometidasSemana(weekStart){
  let total = state.actividades.reduce((s,a)=>s+horasSemanales(a),0);
  const weekEnd = addDays(weekStart,6);
  for(let mkOffset=-1; mkOffset<=1; mkOffset++){
    const mk = monthKey(addDays(weekStart, mkOffset*20));
    const tareas = getTareas(mk);
    tareas.forEach(t=>{
      const td = parseISO(t.fecha);
      if(td>=weekStart && td<=weekEnd) total += Number(t.horas)||0;
    });
  }
  return total;
}
function horasInvertidasPorPilar(mk){
  const out = {};
  getTareas(mk).filter(t=>t.completada).forEach(t=>{ out[t.pilar] = (out[t.pilar]||0) + (Number(t.horas)||0); });
  return out;
}
function horasPorVentaja(){
  // agrega horas mensuales del catálogo por pilar -> ventaja primaria
  const porPilar = cargaCatalogoPorPilar();
  const out = {};
  state.ventajas.forEach(v=>{ out[v.id]=0; });
  Object.keys(porPilar).forEach(pid=>{
    const p = getPilar(pid);
    if(p && p.ventajaPrimaria!=null){ out[p.ventajaPrimaria] = (out[p.ventajaPrimaria]||0) + porPilar[pid]; }
  });
  return out;
}

function monthWeekdayRows(mk){
  const [y,m] = mk.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const last = new Date(y, m, 0);
  const rows = [];
  let currentWeekStart = null, currentRow = [];
  for(let d=new Date(first); d<=last; d=addDays(d,1)){
    const dow = d.getDay();
    if(dow<1 || dow>5) continue;
    const ws = isoDate(startOfWeek(d));
    if(ws !== currentWeekStart){
      if(currentRow.length) rows.push(currentRow);
      currentRow = [];
      currentWeekStart = ws;
    }
    currentRow.push(new Date(d));
  }
  if(currentRow.length) rows.push(currentRow);
  return rows;
}

// Tareas fijas que se repiten solas cada semana — no se guardan como filas
// nuevas cada vez (para no repetir el problema de duplicados de antes):
// se calculan al vuelo para cualquier día, y solo se guarda si están
// marcadas como completadas (una entrada liviana por fecha+id).
function tareasFijasDelDia(d){
  const dow = d.getDay(); // 0=domingo ... 6=sábado
  const out = [];
  if(dow>=1 && dow<=5){
    const dia = DIAS_PUBLICACION[dow-1];
    const pub = (state.publicacionSemanal||SEED_PUBLICACION_SEMANAL)[dia.key];
    out.push({id:'fija:publicacion', titulo:'📌 Publicar: '+(pub||'—'), pilar:null});
  }
  if(dow===1 || dow===5){
    out.push({id:'fija:impulso', titulo:'📌 Mensaje semana Impulso', pilar:'P1'});
  }
  if(dow===5){
    out.push({id:'fija:retoahorro', titulo:'📌 Reto ahorro', pilar:null});
  }
  return out;
}

function tareaFijaCompletada(fecha, id){
  return !!state.tareasFijasCompletadas[fecha+':'+id];

  const esSemanaActual = days.some(d=>isoDate(d)===todayISO);
  let chips = state.actividades.slice();
  if(ui.filtroPrioridad) chips = chips.filter(a=>a.prioridad==='Crítica');
  // Actividades ya programadas alguna vez, en cualquier mes — una vez usadas, desaparecen
  // del panel para siempre (no solo en la semana o el mes que se está viendo).
  const yaAgregadas = new Set();
  (state.config.meses||[]).forEach(mk=>{
    getTareas(mk).forEach(t=>{ if(t.origenActividadId) yaAgregadas.add(t.origenActividadId); });
  });

  const semStart = isoDate(weekStart);
  const semEnd   = isoDate(addDays(weekStart,6));
  const cols = days.map(d=>{
    const iso = isoDate(d);
    const mk = monthKey(d);
    const tareas = tareasDelDia(mk, iso);

    return `
    <div class="day-col ${iso===todayISO?'today':''}" data-day-drop="${iso}">
      <div class="day-head">${dayLabel(d)}${iso===todayISO?' · hoy':''}<br><b>${d.getDate()} ${monthLabel(mk).split(' ')[0]}</b></div>
      ${fijas.map(tf=>renderMiniTaskFija(iso, tf)).join('')}
      ${tareas.map(t=>renderMiniTask(t, mk, {compact:false})).join('')}
      ${(!tareas.length && !fijas.length)?'<div class="small muted">Sin tareas — arrastra aquí una actividad</div>':''}
    </div>`;
  }).join('');

  return `
  ${renderPublicacionSemanal()}

  <div class="row-between" style="margin-bottom:16px;">
    <div>
      <div class="section-title" style="margin-bottom:2px;">Semana</div>
      <h2 style="margin:0;">${weekStart.getDate()} ${monthLabel(monthKey(weekStart)).split(' ')[0]} – ${addDays(weekStart,6).getDate()} ${monthLabel(monthKey(addDays(weekStart,6))).split(' ')[0]}</h2>
      ${esSemanaActual? `<p class="muted small" style="margin:4px 0 0;text-transform:capitalize;">Hoy es ${dayLabel(today)} ${today.getDate()}</p>` : ''}
    </div>
    <div class="row">
      <button class="toggle ${ui.filtroPrioridad?'on':''}" id="toggleFiltro">Solo críticas</button>
      <button class="btn btn-ghost btn-sm" id="btnSemPrev">‹ anterior</button>
      <button class="btn btn-ghost btn-sm" id="btnSemHoy">esta semana</button>
      <button class="btn btn-ghost btn-sm" id="btnSemNext">siguiente ›</button>
    </div>
  </div>

    <div class="row-between">
      <div class="section-title" style="margin:0;">Actividades por pilar</div>
      <button class="btn btn-ghost btn-sm" id="btnNuevaActividad">+ actividad recurrente</button>

    ${ui.actNewOpen? renderFormNuevaActividad() : ''}
    <div class="pilar-picker">
      ${state.pilares.map(p=>{
        const n = actividadesDe(p.id).length;
        return `<button type="button" class="pilar-swatch ${ui.pilarExpandido===p.id?'open':''}" data-pilar-toggle="${p.id}"

async function moverTarea(id, mk, nuevaFechaISO){
  await loadMonth(mk);
  const nuevoMk = monthKey(parseISO(nuevaFechaISO));
  await loadMonth(nuevoMk);
  const t = getTareas(mk).find(x=>x.id===id);
  if(!t) return;
  if(nuevoMk!==mk){
    state.bitacora[mk].tareas = getTareas(mk).filter(x=>x.id!==id);
    t.fecha = nuevaFechaISO;
    state.bitacora[nuevoMk].tareas.push(t);
    await saveMonth(mk,'bitacora'); await saveMonth(nuevoMk,'bitacora');
  } else {
    t.fecha = nuevaFechaISO;
    await saveMonth(mk,'bitacora');
  }
  renderViewport();
}

function renderPilarCardMes(p, mk){

  </button>`;
}
function primerDiaMes(mk){ const [y,m]=mk.split('-').map(Number); return isoDate(new Date(y,m-1,1)); }
function ultimoDiaMes(mk){ const [y,m]=mk.split('-').map(Number); return isoDate(new Date(y,m,0)); }

function accionesPilarEnRango(pid, desde, hasta){
  const out = [];
  (state.config.meses||[]).forEach(mk=>{
    getTareas(mk).forEach(t=>{
      if(t.pilar===pid && t.fecha>=desde && t.fecha<=hasta) out.push(t);
    });
  });
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

function renderSemaforoActividades(pid, mk){
  const desde = ui.bloqueDesde || primerDiaMes(mk);
  const hasta = ui.bloqueHasta || ultimoDiaMes(mk);
  const hoy = isoDate(new Date());
  const acciones = accionesPilarEnRango(pid, desde, hasta);
  const buckets = {
    hechas: {label:'Hechas', badge:'verde', items:[]},
    programadas: {label:'Programadas', badge:'azul', items:[]},
    vencidas: {label:'Vencidas', badge:'rojo', items:[]}
  };
  acciones.forEach(t=>{
    if(t.completada) buckets.hechas.items.push(t);
    else if(t.fecha<hoy) buckets.vencidas.items.push(t);
    else buckets.programadas.items.push(t);
  });
  const chips = Object.entries(buckets).filter(([k,b])=>b.items.length).map(([k,b])=>{
    const activo = ui.accSemaforoFiltro===k;
    return `<button type="button" class="semaforo-chip badge-${b.badge} ${activo?'active':''}" data-acc-semaforo-filtro="${k}"><b>${b.items.length}</b> ${b.label}</button>`;
  }).join('');
  const filtroActivo = ui.accSemaforoFiltro && buckets[ui.accSemaforoFiltro] ? ui.accSemaforoFiltro : null;
  const lista = filtroActivo ? buckets[filtroActivo].items : acciones;

  // Acciones por objetivo táctico (de la lista ya filtrada por el chip activo)
  const porObjetivo = {};
  const sinObjetivoItems = [];
  lista.forEach(t=>{
    if(t.indicadorId!=null) (porObjetivo[t.indicadorId] = porObjetivo[t.indicadorId]||[]).push(t);
    else sinObjetivoItems.push(t);
  });

  const todosObjetivos = state.indicadores.filter(i=>i.pilar===pid);
  // "Atendidos" se calcula sobre TODAS las acciones del rango (sin importar el chip activo)
  const porObjetivoTotal = {};
  acciones.forEach(t=>{ if(t.indicadorId!=null) (porObjetivoTotal[t.indicadorId] = porObjetivoTotal[t.indicadorId]||[]).push(t); });
  const atendidos = todosObjetivos.filter(i=>(porObjetivoTotal[i.id]||[]).length>0).length;

  // Sin filtro activo: se listan TODOS los objetivos (con "Sin acciones" si no tuvieron).
  // Con un chip activo: solo los objetivos que tengan acciones que calcen con ese filtro.
  let grupos = todosObjetivos.map(i=>({ id:i.id, objetivo:i.objetivo, items: porObjetivo[i.id]||[] }));
  if(filtroActivo) grupos = grupos.filter(g=>g.items.length);
  if(sinObjetivoItems.length) grupos.push({ id:null, objetivo:'Sin objetivo táctico', items: sinObjetivoItems });

  const filaAccion = t=>`<tr><td class="small">${t.fecha}</td><td>${esc(t.titulo)}</td><td><span class="badge badge-${t.completada?'verde':(t.fecha<hoy?'rojo':'azul')}">${t.completada?'Hecha':(t.fecha<hoy?'Vencida':'Programada')}</span></td></tr>`;

  return `
  <div class="row-between" style="margin:0;">
    <div class="section-title" style="margin:0;">Semáforo general</div>
    <button class="btn btn-ghost btn-sm" data-nuevo-ind-pilar="${pid}">+ objetivo táctico</button>
  </div>
  <p class="small muted" style="margin:4px 0 10px;">${atendidos} de ${todosObjetivos.length} objetivos tácticos atendidos en este rango.</p>
  ${(ui.indNewOpen && ui.indNewOpenPilar===pid) ? renderFormNuevoIndicador(pid) : ''}
  <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px;">
    <label class="small muted">Del</label>
    <input type="date" id="bloqueDesdeInput" value="${desde}" style="width:auto;padding:5px 7px;font-size:12px;">
    <label class="small muted">al</label>
    <input type="date" id="bloqueHastaInput" value="${hasta}" style="width:auto;padding:5px 7px;font-size:12px;">
  </div>
  <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px;">${chips||'<span class="muted small">Sin acciones hechas o programadas en este rango.</span>'}</div>
  ${grupos.map(g=>{
    const editando = g.id!=null && ui.indEditingId===g.id;
    const header = editando ? `
      <div class="row" style="gap:6px;flex:1;align-items:center;">
        <input type="text" id="editObjetivoInput" value="${esc(g.objetivo)}" style="flex:1;font-size:12px;padding:5px 7px;">
        <button class="btn btn-primary btn-sm" data-save-objetivo="${g.id}">Guardar</button>
        <button class="btn btn-ghost btn-sm" data-cancel-objetivo="${g.id}">Cancelar</button>
      </div>` : `

/* =========================================================
   VISTA MAPA — elemento firma
   ========================================================= */
function polarPoint(cx,cy,r,angleDeg){
  const a = (angleDeg-90)*Math.PI/180;
  return {x: cx+r*Math.cos(a), y: cy+r*Math.sin(a)};
}
function svgWrapLines(label, maxChars){
  const words = String(label).split(' ');
  const lines = []; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length>maxChars && cur){ lines.push(cur.trim()); cur=w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}
function svgNodeText(label, x, y){
  const lines = svgWrapLines(label,13);
  const startDy = -((lines.length-1)*11)/2;
  return `<text x="${x}" y="${y+startDy}">${lines.map((l,i)=>`<tspan x="${x}" dy="${i===0?0:11}">${esc(l)}</tspan>`).join('')}</text>`;
}
function pilaresRelacionados(ventajaId){
  return state.pilares.filter(p=> p.ventajaPrimaria===ventajaId || (p.secundarias||[]).includes(ventajaId));
}
function ventajasRelacionadas(pilarId){
  const p = getPilar(pilarId); if(!p) return [];
  return [p.ventajaPrimaria, ...(p.secundarias||[])].filter(v=>v!=null);
}

function buildCircleSVG({centerLabel, centerSub, nodes, nodeClass, size}){
  size = size||480;
  const cx=size/2, cy=size/2, rCenter=64, rOrbit=size/2-64, rNode=44;
  let svg = `<svg viewBox="0 0 ${size} ${size}" class="mapa-svg" xmlns="http://www.w3.org/2000/svg">`;
  nodes.forEach((n,i)=>{
    const angle = (360/nodes.length)*i;
    const p = polarPoint(cx,cy,rOrbit,angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" class="mapa-line ${n.highlighted?'active':''}" stroke-dasharray="4 5"/>`;
  });
  svg += `<g class="mapa-center"><circle cx="${cx}" cy="${cy}" r="${rCenter}"/>`;
  svg += `<text x="${cx}" y="${cy-4}">${esc(centerLabel)}</text>`;
  if(centerSub) svg += `<text x="${cx}" y="${cy+14}" class="sub">${esc(centerSub)}</text>`;
  svg += `</g>`;
  nodes.forEach((n,i)=>{
    const angle = (360/nodes.length)*i;
    const p = polarPoint(cx,cy,rOrbit,angle);
    const styleAttr = n.color ? ` style="--node-color:${n.color};"` : '';
    svg += `<g class="mapa-node ${nodeClass} ${n.highlighted?'active':''} ${n.special?'p8':''}" data-node-id="${esc(String(n.id))}" tabindex="0" role="button" aria-pressed="${!!n.highlighted}"${styleAttr}>`;
    svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rNode}"/>`;
    svg += svgNodeText(n.label, p.x, p.y);
    svg += `</g>`;
  });
  svg += `</svg>`;
  return svg;
}

function renderMapaContent(){
  const selV = ui.mapaSel.ventaja, selP = ui.mapaSel.pilar;
  const highlightedPilares = selV!=null ? pilaresRelacionados(selV).map(p=>p.id) : (selP? [selP]:[]);

  const nodesPilares = state.pilares.map(p=>({id:p.id, label:p.nombre.split(' – ')[0], highlighted:highlightedPilares.includes(p.id), special:p.id==='P8', color:pilarColorVar(p.id)}));
  const svgPilares = buildCircleSVG({centerLabel:'Eje 3', centerSub:'Movilidad Social', nodes:nodesPilares, nodeClass:'pilar'});

  let sidePanel = '<p class="muted small">Haz clic en un pilar para ver con qué ventaja competitiva se conecta.</p>';
  if(selP){
    const p = getPilar(selP);
    const vs = ventajasRelacionadas(selP).map(id=>getVentaja(id)).filter(Boolean);
    const inds = state.indicadores.filter(i=>i.pilar===selP);
    sidePanel = `
      <div class="small muted">Pilar seleccionado</div>

      ${p.subetiquetas? `<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px;">${p.subetiquetas.map(s=>`<span class="tag tag-nueva">${esc(s)}</span>`).join('')}</div>`:''}
      <p class="small muted" style="margin-top:10px;">${inds.length} indicadores · ${actividadesDe(selP).length} actividades observables.</p>`;
  }

  return `
  <div class="card">
    ${svgPilares}
  </div>
  <div class="card mapa-side">${sidePanel}</div>

  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="gradViolet" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#5B4FD6"/><stop offset="100%" stop-color="#3B2E8F"/>
      </linearGradient>
      <linearGradient id="gradGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#E3C468"/><stop offset="100%" stop-color="#B8912F"/>
      </linearGradient>
      <linearGradient id="gradTeal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#57C9A0"/><stop offset="100%" stop-color="#2FA37A"/>
      </linearGradient>
    </defs>
  </svg>
  `;
}

function bindMapaEvents(){
  document.querySelectorAll('.mapa-node').forEach(el=>{
    const activate = ()=>{
      const id = el.dataset.nodeId;
      const isPilar = el.classList.contains('pilar');
      if(isPilar){
        ui.mapaSel.pilar = (ui.mapaSel.pilar===id)? null : id;
        ui.mapaSel.ventaja = null;
      } else {
        const numId = Number(id);
        ui.mapaSel.ventaja = (ui.mapaSel.ventaja===numId)? null : numId;
        ui.mapaSel.pilar = null;
      }
      renderViewport();
    };
    el.addEventListener('click', activate);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); activate(); }});
  });
}

/* =========================================================
   EXPORTAR / IMPORTAR — red de seguridad
   ========================================================= */
async function exportarJSON(){
  const meses = state.config.meses.length? state.config.meses : [ui.mes];
  const bitacora = {}, cierre = {};
  for(const mk of meses){
    try{ bitacora[mk] = await storeGet('bitacora:'+mk); }catch(e){ bitacora[mk] = state.bitacora[mk] || {tareas:[]}; }
    try{ cierre[mk] = await storeGet('cierre:'+mk); }catch(e){ cierre[mk] = state.cierre[mk] || {narrativa:''}; }
  }
  const payload = {
    exportado: new Date().toISOString(),
    ventajas: state.ventajas, pilares: state.pilares,
    actividades: state.actividades, indicadores: state.indicadores,
    config: state.config, bitacora, cierre
  };
  downloadFile('tablero-movilidad-social-'+isoDate(new Date())+'.json', JSON.stringify(payload,null,2));
}

async function importarJSON(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(data.ventajas) state.ventajas = data.ventajas;
    if(data.pilares) state.pilares = data.pilares;
    if(data.actividades) state.actividades = data.actividades;
    if(data.indicadores) state.indicadores = data.indicadores;
    if(data.config) state.config = data.config;
    if(data.bitacora) state.bitacora = data.bitacora;
    if(data.cierre) state.cierre = data.cierre;
    const meses = new Set(state.config.meses||[]);
    Object.keys(state.bitacora).forEach(mk=>meses.add(mk));
    Object.keys(state.cierre).forEach(mk=>meses.add(mk));
    state.config.meses = Array.from(meses).sort();
    // persistir todo de vuelta
    await storeSet('catalogo:ventajas', state.ventajas);
    await storeSet('catalogo:pilares', state.pilares);
    await storeSet('catalogo:actividades', state.actividades);
    await storeSet('catalogo:indicadores', state.indicadores);
    await storeSet('config', state.config);
    for(const mk of state.config.meses){
      if(state.bitacora[mk]) await storeSet('bitacora:'+mk, state.bitacora[mk]);
      if(state.cierre[mk]) await storeSet('cierre:'+mk, state.cierre[mk]);
    }
    showToast('Importación completa. El tablero se actualizó con los datos del archivo.');
    await render();
  }catch(e){
    console.error(e);
    showToast('No se pudo leer ese archivo. Verifica que sea un JSON exportado desde este tablero.', true);
  }
}

document.getElementById('importInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importarJSON(file);
  e.target.value = '';
});

/* =========================================================
   ARRANQUE
   ========================================================= */
async function init(){
  document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;color:#8E9BB8;">Cargando tablero…</div>';
  try{
    await loadCatalogos();
    ui.mes = monthKey(new Date()); // mes actual
    ui.semanaBase = startOfWeek(new Date());
    ui.progMes = monthKey(new Date());
    await ensureWeekLoaded(ui.semanaBase);
    await loadMonth(ui.mes);
    await loadMonth(ui.progMes);
    // Carga todos los meses conocidos para que "actividad ya usada" se calcule
    // de forma global (no solo con la semana o el mes que se está viendo).
    for(const mk of (state.config.meses||[])) await loadMonth(mk);
  }catch(e){
    console.error('Error al inicializar', e);
  }
  await render();
}
init();
