<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movilidad Social · GEB</title>
<style>
:root{
  --cream:#F7F3E6;
  --cream-2:#F0E9D6;
  --paper:#FFFFFF;
  --ink:#28211C;
  --ink-soft:#6B6255;
  --ink-faint:#9A9184;
  --dark-blue:#1A1AA7;
  --dark-blue-2:#131385;
  --orange:#FFA142;
  --sky-blue:#B1D5F0;
  --sky-blue-deep:#3E8FD1;
  --neon-yellow:#E3F40C;
  --neon-yellow-deep:#B9C700;
  --coffee:#28211C;
  /* alias de compatibilidad con nombres previos, ahora mapeados a la identidad Café del Alma */
  --gold-1:#FFA142;
  --gold-2:#FFB768;
  --violet-1:var(--dark-blue-2);
  --violet-2:var(--dark-blue);
  --teal:#2FA37A;
  --teal-2:#4FC79B;
  --text:var(--ink);
  --text-2:var(--ink-soft);
  --text-3:var(--ink-faint);
  --verde:#3E9B6B;
  --ambar:#D98B1E;
  --rojo:#D3453A;
  --gris:#8A8074;
  --azul:#3E8FD1;
  --lila:#8B7FD6;
  --radius:18px;
  --radius-sm:10px;
  --font-display:'Space Grotesk','Poppins','Nunito','Segoe UI',ui-rounded,system-ui,sans-serif;
  --font-body:'Space Grotesk','Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --border:rgba(40,33,28,0.10);
  --border-2:rgba(40,33,28,0.20);
  --card-bg:#FFFFFF;
  --card-bg-2:#F3EEDF;
  /* colores de los 8 pilares */
  --p1:#1A1AA7; --p1-ink:#FFFFFF;
  --p2:#3E8FD1; --p2-ink:#FFFFFF;
  --p3:#FFA142; --p3-ink:#28211C;
  --p4:#28211C; --p4-ink:#FFFFFF;
  --p5:#C7D400; --p5-ink:#28211C;
  --p6:#FF6B5B; --p6-ink:#FFFFFF;
  --p7:#7B7FE0; --p7-ink:#FFFFFF;
  --p8:#2FA37A; --p8-ink:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 8% -10%, rgba(26,26,167,0.05), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,161,66,0.09), transparent 55%),
    radial-gradient(ellipse 600px 400px at 50% 100%, rgba(227,244,12,0.07), transparent 60%),
    var(--cream);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:var(--font-display);}
button,input,select,textarea{font-family:inherit;color:inherit;}
a{color:var(--dark-blue);}
::selection{background:var(--neon-yellow);color:var(--ink);}

:focus-visible{outline:2px solid var(--dark-blue);outline-offset:2px;border-radius:6px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
}

/* ---------- layout shell ---------- */
#app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(247,243,230,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  margin:0 -20px 28px;
}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:600;}
.brand .title{font-size:19px;font-weight:700;color:var(--dark-blue);}
.nav{display:flex;gap:6px;flex-wrap:wrap;}
.nav button{
  background:transparent;border:1px solid transparent;color:var(--text-2);
  padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.nav button:hover{color:var(--text);background:var(--card-bg-2);}
.nav button.active{color:#fff;background:var(--dark-blue);border-color:transparent;}
.topbar-actions{display:flex;gap:8px;}
.btn{
  border:1px solid var(--border-2);background:var(--card-bg);color:var(--text);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:var(--card-bg-2);border-color:var(--border-2);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--dark-blue);border-color:transparent;color:#fff;}
.btn-primary:hover{filter:brightness(1.12);}
.btn-gold{background:var(--orange);border-color:transparent;color:var(--ink);}
.btn-gold:hover{background:#ff9a2e;}
.btn-ghost{background:transparent;border-color:var(--border-2);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- generic ---------- */
.card{
  background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:0 8px 24px rgba(40,33,28,0.07);
}
.card + .card{margin-top:16px;}
.section-title{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin:0 0 12px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;}}
label{font-size:12.5px;color:var(--text-2);display:block;margin-bottom:5px;font-weight:600;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--border-2);
  border-radius:10px;padding:9px 11px;font-size:14px;color:var(--text);
}
textarea{resize:vertical;min-height:90px;}
input::placeholder,textarea::placeholder{color:var(--text-3);}
.field{margin-bottom:12px;}
.chip{
  display:inline-flex;align-items:center;gap:8px;background:var(--card-bg-2);
  border:1px solid var(--border-2);border-radius:999px;padding:6px 8px 6px 14px;font-size:12.5px;color:var(--text);
}
.chip .pri{width:7px;height:7px;border-radius:50%;flex:none;}
.pri-critica{background:var(--rojo);}
.pri-estrategica{background:var(--ambar);}
.pri-evolutiva{background:var(--azul);}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:2px 8px;border-radius:6px;}
.tag-nueva{background:rgba(47,163,122,0.15);color:#1f7a5c;border:1px solid rgba(47,163,122,0.4);}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;}
.badge-gris{background:rgba(138,128,116,0.16);color:#6B6255;}
.badge-azul{background:rgba(62,143,209,0.16);color:#25679e;}
.badge-verde{background:rgba(62,155,107,0.16);color:#256b48;}
.badge-ambar{background:rgba(217,139,30,0.16);color:#9c650f;}
.badge-rojo{background:rgba(211,69,58,0.14);color:#a8291f;}
.badge-lila{background:rgba(139,127,214,0.16);color:#5b4fb8;}
.badge-naranja{background:rgba(255,161,66,0.22);color:#a15a10;}
.hr{height:1px;background:var(--border);margin:16px 0;border:0;}
.muted{color:var(--text-2);}
.small{font-size:12.5px;}
.empty{padding:30px 16px;text-align:center;color:var(--text-2);border:1px dashed var(--border-2);border-radius:var(--radius-sm);}
.row{display:flex;align-items:center;gap:10px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.checkbox{
  width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-2);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:var(--paper);
}
.checkbox.done{background:var(--teal);border-color:transparent;}
.checkbox.done::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
.task-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
.task-row:last-child{border-bottom:none;}
.task-title{font-size:14.5px;flex:1;}
.task-title.done{color:var(--text-3);text-decoration:line-through;}
.task-meta{font-size:11.5px;color:var(--text-2);display:flex;gap:8px;align-items:center;}
.iconbtn{background:transparent;border:none;color:var(--text-3);cursor:pointer;padding:4px;border-radius:6px;font-size:15px;line-height:1;}
.iconbtn:hover{color:var(--rojo);background:rgba(211,69,58,0.1);}

/* progress bar */
.barwrap{background:var(--card-bg-2);border-radius:999px;height:14px;overflow:hidden;position:relative;}
.barfill{height:100%;border-radius:999px;background:var(--orange);transition:width .4s ease;}
.barfill.over{background:var(--rojo);}
.overload-label{color:var(--rojo);font-weight:700;font-size:13px;margin-top:8px;}

/* pillar list (Presentación / Indicadores) */
.pilar-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:var(--paper);}
.pilar-card.p8{border-color:rgba(47,163,122,0.4);background:linear-gradient(135deg,rgba(47,163,122,0.08),rgba(26,26,167,0.04));}
.pilar-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.pilar-name{font-weight:700;font-size:14.5px;}
.pilar-pct{font-family:var(--font-display);font-weight:700;font-size:19px;}

/* selector de pilares con color (Semana) */
.pilar-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:820px){.pilar-picker{grid-template-columns:repeat(4,1fr);}}
.pilar-swatch{
  border:none;border-radius:14px;padding:14px 12px;cursor:pointer;text-align:left;
  color:var(--swatch-ink);background:var(--swatch-color);position:relative;overflow:hidden;
  transition:transform .12s,box-shadow .12s;box-shadow:0 4px 12px rgba(40,33,28,0.08);
}
.pilar-swatch:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(40,33,28,0.16);}
.pilar-swatch.open{outline:3px solid var(--ink);outline-offset:2px;}
.pilar-swatch .pid{font-family:var(--font-display);font-weight:700;font-size:16px;display:block;}
.pilar-swatch .pname{font-size:11.5px;opacity:.9;display:block;margin-top:2px;line-height:1.25;}
.pilar-swatch .pcount{position:absolute;top:10px;right:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,0.28);padding:2px 8px;border-radius:999px;}
.pilar-panel{border-radius:var(--radius-sm);padding:16px;margin-top:12px;border:2px solid var(--panel-color);background:var(--paper);}
.pilar-panel .panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pilar-panel .dot{width:12px;height:12px;border-radius:50%;background:var(--panel-color);flex:none;}
.activity-chip{
  display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:8px 10px;font-size:12.5px;
  background:var(--paper);border:1.5px solid var(--panel-color);color:var(--ink);cursor:grab;margin:0 8px 8px 0;
}
.activity-chip:active{cursor:grabbing;}
.activity-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--panel-color);flex:none;}
.nueva-row{
  display:flex;align-items:center;gap:8px;border-radius:10px;padding:6px 6px 6px 12px;margin:0 0 8px 0;
  background:var(--card-bg-2);border:1.5px dashed var(--panel-color);
}
.nueva-row input{border:none;background:transparent;padding:4px 2px;font-size:12.5px;}
.nueva-row input:focus{outline:none;}

/* tarjetas por pilar — vista Mes (mobile-first: 1 col base, crece con el viewport) */
.pilar-mes-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:600px){.pilar-mes-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1000px){.pilar-mes-grid{grid-template-columns:repeat(4,1fr);}}
.pilar-mes-card{
  border:none;border-radius:16px;padding:16px;text-align:left;cursor:pointer;
  background:var(--card-color);color:var(--card-ink);
  box-shadow:0 4px 14px rgba(40,33,28,0.12);transition:transform .12s,box-shadow .12s;
  font-family:var(--font-body);width:100%;
}
.pilar-mes-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(40,33,28,0.2);}
.pilar-mes-card.open{outline:3px solid var(--ink);outline-offset:2px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.94);color:var(--ink);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.ventaja-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.26);border-radius:999px;padding:3px 10px 3px 7px;font-size:11px;font-weight:700;margin-top:6px;}
.ventaja-feature{display:flex;align-items:center;gap:12px;background:var(--card-bg-2);border-left:4px solid var(--panel-color);border-radius:12px;padding:12px 14px;margin:12px 0 16px;}
.ventaja-feature-icon{width:38px;height:38px;border-radius:50%;background:var(--panel-color);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}

/* semáforo visual por objetivo táctico */
.semaforo-chip{
  border:none;border-radius:12px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;opacity:.85;transition:opacity .12s,transform .12s;
}
.semaforo-chip:hover{opacity:1;transform:translateY(-1px);}
.semaforo-chip.active{opacity:1;outline:2px solid var(--ink);outline-offset:1px;}
.semaforo-chip b{font-size:15px;}
.objetivo-row{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.objetivo-row-head{
  width:100%;background:var(--paper);border:none;padding:10px 12px;cursor:pointer;
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text);text-align:left;
}
.objetivo-row-head:hover{background:var(--card-bg-2);}
.objetivo-actions{background:var(--card-bg-2);padding:8px 14px;border-top:1px solid var(--border);}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border-2);font-weight:700;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:var(--card-bg-2);}
td input[type=number]{width:78px;padding:5px 7px;}
.tbl-wrap{overflow-x:auto;}

/* week grid */
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;}
.day-col{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;min-height:160px;background:var(--paper);transition:background .12s,border-color .12s;}
.day-col.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset;}
.day-col.drag-over{background:var(--card-bg-2);border-color:var(--dark-blue);box-shadow:0 0 0 2px var(--dark-blue) inset;}
.day-head{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:8px;text-transform:capitalize;}
.day-head b{color:var(--text);}
.mini-task{background:var(--card-bg-2);border-radius:8px;padding:7px 8px;font-size:12px;margin-bottom:6px;border-left:3px solid var(--mini-color,var(--border-2));}
.mini-task select{margin-top:5px;font-size:11px;padding:4px 6px;}
.prog-mes-headrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px;}
.prog-mes-headcell{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;text-align:center;}
.prog-mes-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px;}
.day-col-compact{min-height:64px;padding:8px;}
.day-col-compact .day-head{margin-bottom:4px;font-size:11px;}
.day-col-compact .mini-task{padding:5px 6px;margin-bottom:4px;font-size:11px;}

/* slides */
.slide{padding:46px 6px;border-bottom:1px dashed var(--border);}
.slide:last-child{border-bottom:none;}
.slide-eyebrow{font-size:12px;color:var(--orange);text-transform:uppercase;letter-spacing:.14em;font-weight:700;margin-bottom:10px;}
.slide h2{font-size:clamp(22px,3vw,32px);margin:0 0 18px;}
.slide-cover{text-align:center;padding:80px 6px;}
.slide-cover .title{font-size:clamp(30px,5vw,46px);color:var(--dark-blue);font-weight:700;margin:14px 0;}

/* map */
.mapa-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:900px){.mapa-wrap{grid-template-columns:1fr;}}
.mapa-svg{width:100%;height:auto;}
.mapa-node circle{fill:var(--dark-blue);stroke:rgba(255,255,255,0.5);stroke-width:1;filter:drop-shadow(0 6px 14px rgba(40,33,28,0.18));cursor:pointer;transition:transform .15s;}
.mapa-node.pilar circle{fill:var(--node-color,var(--orange));}
.mapa-node.p8 circle{fill:var(--p8);}
.mapa-node:hover circle{transform:scale(1.06);transform-origin:center;}
.mapa-node.active circle{stroke:var(--ink);stroke-width:2.5;}
.mapa-node text{fill:#fff;font-size:10.5px;font-family:var(--font-body);pointer-events:none;text-anchor:middle;}
.mapa-node.pilar text, .mapa-node.p8 text{fill:#fff;}
.mapa-line{stroke:rgba(40,33,28,0.18);stroke-width:1.2;}
.mapa-line.active{stroke:var(--dark-blue);stroke-width:1.8;}
.mapa-center circle{fill:var(--paper);stroke:var(--border-2);stroke-width:1.4;}
.mapa-center text{fill:var(--text);font-family:var(--font-display);font-weight:700;font-size:13px;text-anchor:middle;}
.mapa-center .sub{fill:var(--text-2);font-family:var(--font-body);font-weight:400;font-size:10px;}
.mapa-side{margin-top:14px;}

/* filters */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filterbar select{width:auto;padding:7px 10px;font-size:12.5px;}
.toggle{
  background:var(--card-bg);border:1px solid var(--border-2);border-radius:999px;padding:6px 13px;
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-2);
}
.toggle.on{background:var(--dark-blue);color:#fff;border-color:transparent;}

.hidden{display:none !important;}

footer.appfoot{text-align:center;color:var(--text-3);font-size:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border);}


.mejora-chip-day{font-size:9.5px;padding:2px 5px;border-radius:4px;background:rgba(47,163,122,.12);
  border-left:3px solid var(--verde);color:var(--teal);margin-bottom:3px;display:flex;
  align-items:center;gap:4px;overflow:hidden;}
.mejora-chip-day span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.mejora-band{background:rgba(47,163,122,.13);border-left:3px solid var(--verde);border-radius:5px;
  padding:3px 8px;font-size:10.5px;color:var(--teal);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;cursor:default;}
.mejora-band:hover{background:rgba(47,163,122,.22);}
@media print{
  .topbar,.no-print{display:none !important;}
  body{background:#fff;color:#111;}
  #app{max-width:100%;padding:0;}
  .slide{page-break-after:always;padding:20px 0;border-bottom:none;}
  .card{box-shadow:none;border-color:#ccc;}
  .slide-cover .title{color:#1A1AA7;}
}
@media(max-width:640px){
  .grid-3{grid-template-columns:1fr;}
  .topbar-inner{flex-direction:column;align-items:flex-start;}
  .nav{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;}
  .pilar-picker{grid-template-columns:repeat(2,1fr);}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<div id="app"></div>

<script>
'use strict';

/* =========================================================
   UTILIDADES
   ========================================================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function monthKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function startOfWeek(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addMonths(monthKeyStr,n){ const [y,m]=monthKeyStr.split('-').map(Number); const d=new Date(y,m-1+n,1); return monthKey(d); }
function monthLabel(monthKeyStr){
  const [y,m]=monthKeyStr.split('-').map(Number);
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return meses[m-1]+' '+y;
}
function dayLabel(d){
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  return dias[d.getDay()];
}
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function downloadFile(filename, content, type){
  const blob = new Blob([content], {type: type||'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function showToast(message, isError){
  const el = document.createElement('div');
  el.textContent = message;
  el.style.cssText = `position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:${isError?'#D3453A':'#1A1AA7'};color:#fff;padding:12px 20px;border-radius:12px;
    font-family:'Space Grotesk','Inter',system-ui,sans-serif;font-size:13.5px;font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:9999;max-width:90vw;text-align:center;`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}

/* Conversión de frecuencia a horas mensuales / semanales */
function horasMensuales(act){
  const h = Number(act.horas)||0;
  switch(act.frecuencia){
    case 'Semanal': return h*4.33;
    case 'Mensual': return h*1;
    case 'Trimestral': return h/3;
    case 'Semestral': return h/6;
    case 'Anual': return h/12;
    case 'Por caso':
    case 'Por proceso': return h;
    default: return h;
  }
}
function horasSemanales(act){ return horasMensuales(act)/4.33; }

/* pct / semáforo — modelo histórico: el "real" vive por mes en state.indicadorHist */
function getRealMes(ind, mk){
  mk = mk || ui.mes;
  const h = state.indicadorHist[mk];
  if(h && h[ind.id]!=null) return h[ind.id];
  return null;
}
function pctCumplimiento(ind, mk){
  if(ind.estado==='sin_definir' || ind.estado==='revisar') return null;
  const real = getRealMes(ind, mk);
  if(real==null || ind.meta==null || ind.meta===0) return null;
  return (real/ind.meta)*100;
}
function brecha(ind, mk){
  const p = pctCumplimiento(ind, mk);
  return p==null ? null : (100-p);
}
function semaforo(ind, mk){
  if(ind.estado==='sin_definir') return 'gris';
  if(ind.estado==='revisar') return 'azul';
  if(ind.estado==='borrador') return 'lila';
  const p = pctCumplimiento(ind, mk);
  if(p==null) return 'gris';
  if(p>=90) return 'verde';
  if(p>=70) return 'ambar';
  return 'rojo';
}
const SEMAFORO_LABEL = {verde:'En meta',ambar:'En riesgo',rojo:'Crítico',gris:'Sin definir',azul:'Por revisar',lila:'Borrador'};

function tieneActividadLigada(indId){
  return state.actividades.some(a=>a.indicadorId===indId);
}
function estadoObjetivo(ind, mk){
  if(ind.estado==='sin_definir') return 'sin_definir';
  if(ind.estado==='revisar') return 'revisar';
  if(ind.estado==='borrador') return 'borrador';
  if(!tieneActividadLigada(ind.id)) return 'sin_atender';
  const pct = pctCumplimiento(ind, mk);
  if(pct==null) return 'trabajando';
  if(pct<70) return 'critico';
  if(pct<90) return 'riesgo';
  return 'meta';
}

async function storeGet(key){
  const { data, error } = await db
    .from('tablero_kv')
    .select('value')
    .eq('key', key)
    .single();
  if(error || !data) throw new Error('empty');
  return data.value;
}

async function storeSet(key, value){
  await db.from('tablero_kv').upsert(
    { key, value, updated_at: new Date().toISOString() },
    { onConflict: 'key' }
  );
}
async function getOrSeed(key, seedValue){

  state.config = await getOrSeed('config', {horasSemana:30, horasMes:130, meses:[]});
  if(!state.config.meses) state.config.meses = [];
  // Limpieza única: borra cualquier catálogo de actividades fijas guardado previamente.
  if(!state.config.actividadesFijasLimpiadas){
    state.actividades = [];
    await storeSet('catalogo:actividades', []);
    state.config.actividadesFijasLimpiadas = true;
    await storeSet('config', state.config);
  }
  // Migración única: mete los "real" antiguos (a nivel catálogo) al histórico del mes que se está reportando
  // (el mes anterior al actual: cuando abres el tablero en agosto, reportas julio).
  if(!state.config.indicadoresMigrados){
    const mkReporte = addMonths(monthKey(new Date()), -1);
    await loadMonth(mkReporte);
    if(!state.indicadorHist[mkReporte]) state.indicadorHist[mkReporte] = {};
    state.indicadores.forEach(ind=>{
      if(ind.estado==='definido' && ind.real!=null && state.indicadorHist[mkReporte][ind.id]==null){

    state.config.indicadoresMigrados = true;
    await storeSet('config', state.config);
  }
  // Migración única: si ya había resultados capturados en agosto (mes en curso), los mueve a julio
  // (el mes que se está presentando), fusionando con lo que ya hubiera en julio.
  if(!state.config.resultadosMovidosAJulio){
    const mkDestino = '2026-07', mkOrigen = '2026-08';
    await loadMonth(mkOrigen); await loadMonth(mkDestino);
    if(state.indicadorHist[mkOrigen] && Object.keys(state.indicadorHist[mkOrigen]).length){
      state.indicadorHist[mkDestino] = {...state.indicadorHist[mkOrigen], ...state.indicadorHist[mkDestino]};
      state.indicadorHist[mkOrigen] = {};
      await storeSet('indhist:'+mkDestino, state.indicadorHist[mkDestino]);
      await storeSet('indhist:'+mkOrigen, state.indicadorHist[mkOrigen]);
    }
    if(state.bitacora[mkOrigen] && state.bitacora[mkOrigen].tareas.length){
      state.bitacora[mkDestino].tareas = state.bitacora[mkDestino].tareas.concat(state.bitacora[mkOrigen].tareas);
      state.bitacora[mkOrigen].tareas = [];
      await storeSet('bitacora:'+mkDestino, state.bitacora[mkDestino]);
      await storeSet('bitacora:'+mkOrigen, state.bitacora[mkOrigen]);
    }
    if(state.unopct[mkOrigen] && state.unopct[mkOrigen].archivos.length){
      state.unopct[mkDestino].archivos = state.unopct[mkDestino].archivos.concat(state.unopct[mkOrigen].archivos);
      state.unopct[mkOrigen].archivos = [];
      await storeSet('unopct:'+mkDestino, state.unopct[mkDestino]);
      await storeSet('unopct:'+mkOrigen, state.unopct[mkOrigen]);
    }
    if(state.cierre[mkOrigen] && state.cierre[mkOrigen].narrativa && !state.cierre[mkDestino].narrativa){
      state.cierre[mkDestino].narrativa = state.cierre[mkOrigen].narrativa;
      state.cierre[mkOrigen].narrativa = '';
      await storeSet('cierre:'+mkDestino, state.cierre[mkDestino]);
      await storeSet('cierre:'+mkOrigen, state.cierre[mkOrigen]);
    }
    state.config.resultadosMovidosAJulio = true;
    await storeSet('config', state.config);
  }
  // Migración única: los indicadores de P3 (Certificación ESR) tenían KPIs de otro
  // contexto (hospitalidad) pegados por error; se limpian para definirse desde cero.
  if(!state.config.indicadoresP3Limpiados){
    const idsP3Afectados = [];
    state.indicadores.forEach(ind=>{
      if(ind.pilar==='P3'){
        idsP3Afectados.push(ind.id);
        ind.kpi = null; ind.meta = null; ind.real = null; ind.estandar = null;
        ind.estado = 'sin_definir'; ind.nota = 'KPI pendiente de definir.';

    });
    await storeSet('catalogo:indicadores', state.indicadores);
    const mkJul = '2026-07';
    await loadMonth(mkJul);
    if(state.indicadorHist[mkJul]){
      let cambiado = false;
      idsP3Afectados.forEach(id=>{
        if(state.indicadorHist[mkJul][id]!=null){ delete state.indicadorHist[mkJul][id]; cambiado = true; }
      });
      if(cambiado) await storeSet('indhist:'+mkJul, state.indicadorHist[mkJul]);
    }
    state.config.indicadoresP3Limpiados = true;
    await storeSet('config', state.config);
  }
  // Migración única: P8 (Upskilling) no tenía objetivos tácticos definidos.
  if(!state.config.objetivosP8Agregados){
    const maxId = state.indicadores.reduce((m,i)=>Math.max(m,i.id),0);
    let nextId = maxId + 1;
    const nuevosP8 = [
      {objetivo:'Diagnóstico de Brechas Digitales: identificar nivel de dominio de IA y herramientas digitales por colaborador y rol.'},

    state.indicadores = state.indicadores.concat(nuevosP8);
    await storeSet('catalogo:indicadores', state.indicadores);
    state.config.objetivosP8Agregados = true;
    await storeSet('config', state.config);
  }
}

function chipsActividadesSemana(){

  return state.actividades.filter(a=>a.frecuencia==='Semanal');
}
function chipsActividadesMensuales(refDate){
  if(refDate.getDate()>7) return [];
  return state.actividades.filter(a=>a.frecuencia==='Mensual');
}
function tareasDelDia(mk, fechaISO){
  return getTareas(mk).filter(t=>t.fecha===fechaISO);
}
function horasComprometidasSemana(weekStart){
  let total = state.actividades.reduce((s,a)=>s+horasSemanales(a),0);
  const weekEnd = addDays(weekStart,6);
  for(let mkOffset=-1; mkOffset<=1; mkOffset++){
    const mk = monthKey(addDays(weekStart, mkOffset*20));
    const tareas = getTareas(mk);
    tareas.forEach(t=>{
      const td = parseISO(t.fecha);
      if(td>=weekStart && td<=weekEnd) total += Number(t.horas)||0;
    });
  }
  return total;
}
function horasInvertidasPorPilar(mk){
  const out = {};
  getTareas(mk).filter(t=>t.completada).forEach(t=>{ out[t.pilar] = (out[t.pilar]||0) + (Number(t.horas)||0); });
  return out;
}
function horasPorVentaja(){
  // agrega horas mensuales del catálogo por pilar -> ventaja primaria
  const porPilar = cargaCatalogoPorPilar();
  const out = {};
  state.ventajas.forEach(v=>{ out[v.id]=0; });
  Object.keys(porPilar).forEach(pid=>{
    const p = getPilar(pid);
    if(p && p.ventajaPrimaria!=null){ out[p.ventajaPrimaria] = (out[p.ventajaPrimaria]||0) + porPilar[pid]; }
  });
  return out;
}
function avancePorPilar(mk){
  mk = mk || ui.mes;
  const out = {};
  state.pilares.forEach(p=>{
    const inds = state.indicadores.filter(i=>i.pilar===p.id);
    const medibles = inds.filter(i=>i.estado==='definido' || i.estado==='borrador');
    const conValor = medibles.filter(i=>pctCumplimiento(i,mk)!=null);
    const avg = conValor.length ? conValor.reduce((s,i)=>s+pctCumplimiento(i,mk),0)/conValor.length : null;
    out[p.id] = {avg, total:inds.length, medidos:conValor.length};
  });
  return out;
}

function weekMonthKeys(weekStart){
  const set = new Set();
  for(let i=0;i<7;i++) set.add(monthKey(addDays(weekStart,i)));
  return Array.from(set);
}
async function ensureWeekLoaded(weekStart){
  for(const mk of weekMonthKeys(weekStart)) await loadMonth(mk);
}

function frecuenciaFechas(frecuencia, fechaISO){
  if(frecuencia!=='Semanal') return [fechaISO];
  // Repite el mismo día de la semana en todas las semanas del mes de la fecha elegida
  const start = parseISO(fechaISO);
  const mesRef = start.getMonth();
  const fechas = [];
  for(let d=new Date(start); d.getMonth()===mesRef; d=addDays(d,7)){
    fechas.push(isoDate(d));
  }
  return fechas;
}

async function addTareaFromChip(actId, fechaISO, autoComplete){
  const act = state.actividades.find(a=>a.id===actId);
  if(!act) return;
  const fechas = frecuenciaFechas(act.frecuencia, fechaISO);
  for(const fecha of fechas){
    const mk = monthKey(parseISO(fecha));
    await loadMonth(mk);
    state.bitacora[mk].tareas.push({
      id: uid('t'), titulo: act.actividad, pilar: act.pilar, horas: act.horas,
      fecha, completada: !!autoComplete, prioridad: act.prioridad,
      indicadorId: act.indicadorId!=null ? act.indicadorId : null,
      origenActividadId: act.id
    });
  }
  const mesesTocados = new Set(fechas.map(f=>monthKey(parseISO(f))));
  for(const mk of mesesTocados) await saveMonth(mk,'bitacora');
  renderViewport();
}

function renderMejorasBanda(mejActivas, days){
  if(!mejActivas.length) return '';
  const bands = mejActivas.map(m=>{
    const d1=isoDate(addDays(parseISO(m.fechaInicio),m.dias||0));
    let s=-1,e=-1;
    days.forEach((d,i)=>{const iso=isoDate(d);if(iso>=m.fechaInicio&&iso<=d1){if(s<0)s=i;e=i;}});
    if(s<0) return '';
    const c0=s+1,c1=e+2;
    const txt=m.propuesta.length>38?m.propuesta.slice(0,36)+'…':m.propuesta;
    return '<div class="mejora-band" title="'+esc(m.propuesta)+
           '" style="grid-column:'+c0+'/'+c1+';">✦ '+esc(txt)+'</div>';
  }).join('');

         'Mejoras 1% activas esta semana</div>'+
         '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">'+bands+'</div></div>';

function monthWeekdayRows(mk){
  const [y,m] = mk.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const last = new Date(y, m, 0);
  const rows = [];
  let currentWeekStart = null, currentRow = [];
  for(let d=new Date(first); d<=last; d=addDays(d,1)){
    const dow = d.getDay();
    if(dow<1 || dow>5) continue;
    const ws = isoDate(startOfWeek(d));
    if(ws !== currentWeekStart){
      if(currentRow.length) rows.push(currentRow);
      currentRow = [];
      currentWeekStart = ws;
    }
    currentRow.push(new Date(d));
  }
  if(currentRow.length) rows.push(currentRow);
  return rows;
}

async function guardarEdicionTarea(id, mk){
  const titulo = document.querySelector(`[data-edit-titulo="${id}"]`).value.trim();
  const pilar = document.querySelector(`[data-edit-pilar="${id}"]`).value;
  const indicadorSel = document.querySelector(`[data-edit-indicador="${id}"]`).value;
  const fecha = document.querySelector(`[data-edit-fecha="${id}"]`).value;
  if(!titulo){ ui.tareaEditError='Escribe un título.'; renderViewport(); return; }
  if(!pilar){ ui.tareaEditError='Asigna un pilar.'; renderViewport(); return; }
  if(!fecha){ ui.tareaEditError='Elige una fecha.'; renderViewport(); return; }
  ui.tareaEditError='';
  await loadMonth(mk);
  const t = getTareas(mk).find(x=>x.id===id);
  if(!t) return;
  t.titulo = titulo;
  t.pilar = pilar;
  t.indicadorId = (indicadorSel==='none'||!indicadorSel) ? null : Number(indicadorSel);
  const nuevoMk = monthKey(parseISO(fecha));
  if(nuevoMk!==mk){
    state.bitacora[mk].tareas = getTareas(mk).filter(x=>x.id!==id);
    t.fecha = fecha;
    await loadMonth(nuevoMk);
    state.bitacora[nuevoMk].tareas.push(t);
    await saveMonth(mk,'bitacora');
    await saveMonth(nuevoMk,'bitacora');
  } else {
    t.fecha = fecha;
    await saveMonth(mk,'bitacora');
  }
  ui.tareaEditando = null;
  renderViewport();
}

async function guardarTareaFormSemana(){
  const titulo = document.getElementById('wsTitulo').value.trim();
  const pilar = document.getElementById('wsPilar').value;
  const _wd=ui.semanaBase,_days=[...Array(7)].map((_,i)=>addDays(_wd,i)),_t=isoDate(new Date());
  const fecha=_days.some(d=>isoDate(d)===_t)?_t:isoDate(_days[0]);
  if(!pilar){ ui.semanaFormError='Asigna un tema (pilar); sin él la tarea no sube al reporte.'; renderViewport(); return; }
  if(!titulo){ ui.semanaFormError='Escribe un título para la tarea.'; renderViewport(); return; }
  ui.semanaFormError='';
  const mk = monthKey(parseISO(fecha));
  await loadMonth(mk);
  state.bitacora[mk].tareas.push({id:uid('t'),titulo,pilar,horas:null,fecha,completada:false,prioridad:null,indicadorId:null,origenActividadId:null});
  await saveMonth(mk,'bitacora');
  ui.semanaFormOpen = false;
  renderViewport();
}

async function procesarUnoPct(){
  const mk = unopctMonthKey();
  const raw = document.getElementById('unopctText').value;
  const lineas = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lineas.length) return;
  await loadMonth(mk);
  lineas.forEach(nombre=>{
    state.unopct[mk].archivos.push({nombre, pilar: clasificarArchivo(nombre)});
  });
  await saveMonth(mk,'unopct');
  renderViewport();
}
async function actualizarUnoPilar(idx, pilar){
  const mk = unopctMonthKey(); await loadMonth(mk);
  if(state.unopct[mk].archivos[idx]) state.unopct[mk].archivos[idx].pilar = pilar;
  await saveMonth(mk,'unopct');
  renderViewport();
}
async function eliminarUnoArchivo(idx){
  const mk = unopctMonthKey(); await loadMonth(mk);
  state.unopct[mk].archivos.splice(idx,1);
  await saveMonth(mk,'unopct');
  renderViewport();
}

const KEYWORD_PILAR = [
  [/beca|escuela|prepa|rezago/i,'P2'],
  [/\bia\b|automatiz|prompt|claude|ia\.|inteligencia artificial/i,'P8'],
  [/bienestar|salud|psicol|fitness|nutric/i,'P5'],
  [/family|apoyo|emocional/i,'P6'],
  [/ingreso|salario|prestac|beneficio/i,'P4'],
  [/esr|certificaci|gptw|hospitalidad/i,'P3'],
  [/ikigai|prop[oó]sito|plan de vida/i,'P7'],
  [/vacante|mentor[ií]a|carrera|idioma|semáforo|semaforo/i,'P1']
];
function clasificarArchivo(nombre){
  for(const [rx,pid] of KEYWORD_PILAR){ if(rx.test(nombre)) return pid; }
  return '';
}

/* =========================================================
   VISTA MES — unificada (KPIs por pilar, acciones, mejoras 1%, mapa)
   ========================================================= */
function estadoPilarInfo(avg){
  if(avg==null) return {color:'gris', label:'Sin datos'};
  if(avg>=90) return {color:'verde', label:'En meta'};
  if(avg>=70) return {color:'ambar', label:'En riesgo'};
  return {color:'rojo', label:'Crítico'};
}
function svgDonut(pct, size){
  size = size || 56;
  const r = size/2 - 6;
  const c = 2*Math.PI*r;
  const p = pct==null ? 0 : clamp(pct,0,100);
  const dash = (p/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="6"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="currentColor" stroke-width="6"
      stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 ${(size/2).toFixed(1)} ${(size/2).toFixed(1)})"/>
    <text x="${size/2}" y="${size/2+4}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" font-family="var(--font-display)">${pct==null?'—':Math.round(pct)+'%'}</text>
  </svg>`;
}
function ventajaIcon(size){
  size = size||13;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" style="flex:none;"><path d="M12 2 L14.3 9.7 L22 12 L14.3 14.3 L12 22 L9.7 14.3 L2 12 L9.7 9.7 Z"/></svg>`;
}
function renderPilarCardMes(p, mk, avanceObj){
  const info = estadoPilarInfo(avanceObj.avg);
  const prevMk = addMonths(mk,-1);
  const avancePrev = avancePorPilar(prevMk)[p.id];
  let deltaTxt = '';
  if(avanceObj.avg!=null && avancePrev.avg!=null){
    const d = Math.round(avanceObj.avg-avancePrev.avg);
    const arrow = d>0?'▲':(d<0?'▼':'●');
    deltaTxt = `${arrow} ${Math.abs(d)} pts vs mes anterior`;
  }
  const ventaja = p.ventajaPrimaria!=null ? getVentaja(p.ventajaPrimaria) : null;
  const accionesMes = getTareas(mk).filter(t=>t.pilar===p.id && t.completada).length;
  return `
  <button type="button" class="pilar-mes-card ${ui.pilarMesExpandido===p.id?'open':''}" data-pilar-mes-toggle="${p.id}" style="--card-color:${pilarColorVar(p.id)};--card-ink:${pilarInkVar(p.id)};">
    <div class="row-between" style="align-items:flex-start;">
      <div>
        <div style="font-family:var(--font-display);font-weight:700;font-size:15px;">${p.id} · ${esc(p.nombre)}</div>
        ${ventaja? `<span class="ventaja-chip">${ventajaIcon(11)}${esc(ventaja.nombre)}</span>`:''}
      </div>
      ${svgDonut(avanceObj.avg,56)}
    </div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px;">
      <span class="status-pill"><span class="dot" style="background:var(--${info.color});"></span>${info.label}</span>
    </div>
    ${deltaTxt? `<div class="small" style="margin-top:6px;opacity:.9;">${deltaTxt}</div>`:''}
    <div class="row-between small" style="margin-top:10px;opacity:.9;">
      <span>${avanceObj.medidos}/${avanceObj.total} KPIs medidos</span>
      <span>${accionesMes} acción(es) del mes</span>
    </div>
  </button>`;
}
function renderTablaMejorasCompleta(){
  let list = state.mejoras.slice().sort((a,b)=> b.fechaInicio.localeCompare(a.fechaInicio) || b.numero-a.numero);
  if(ui.mejorasFiltroProceso!=='all') list = list.filter(m=>m.proceso===ui.mejorasFiltroProceso);

    <div style="margin-top:16px;">

function renderSemaforoVisual(pid, mk){
  const inds = state.indicadores.filter(i=>i.pilar===pid);
  // 3 buckets — independent from indicator detail states
  const BUCKETS = {
    atrasado: { label:'Atrasado', badge:'rojo', states:['critico','riesgo'] },
    en_proceso: { label:'En proceso', badge:'naranja', states:['trabajando','revisar','meta'] },
    sin_atencion: { label:'Sin atención', badge:'gris', states:['sin_atender','sin_definir','borrador'] }
  };
  const bucketOf = i => {
    const s = estadoObjetivo(i, mk);
    for(const [k,b] of Object.entries(BUCKETS)) if(b.states.includes(s)) return k;
    return 'sin_atencion';
  };
  const grupos3 = { atrasado:[], en_proceso:[], sin_atencion:[] };
  inds.forEach(i=>grupos3[bucketOf(i)].push(i));

  const chips = Object.entries(BUCKETS).filter(([k])=>grupos3[k].length).map(([k,b])=>{
    const activo = ui.semaforoFiltro===k;
    return '<button type="button" class="semaforo-chip badge-'+b.badge+' '+(activo?'active':'')+'" data-semaforo-filtro="'+k+'">'+
           '<b>'+grupos3[k].length+'</b> '+b.label+'</button>';
  }).join('');

  const filtroActivo = ui.semaforoFiltro && grupos3[ui.semaforoFiltro] ? ui.semaforoFiltro : null;
  const lista = filtroActivo ? grupos3[filtroActivo] : inds;
  return '<div class="section-title">Semáforo general</div>'+
    '<p class="small muted" style="margin-top:-6px;">Toca una categoría para filtrar, y un objetivo para ver sus acciones del mes.</p>'+
    '<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px;">'+(chips||'<span class="muted small">Sin indicadores en este pilar.</span>')+'</div>'+
    '<div>'+( lista.map(i=>renderObjetivoRow(i, mk)).join('') || '<p class="small muted">Sin objetivos en esta categoría.</p>' )+'</div>';
}

function renderTablaMejorasMes(mk){
  let list=state.mejoras.filter(m=>monthKey(parseISO(m.fechaInicio))===mk)
    .sort((a,b)=>b.fechaInicio.localeCompare(a.fechaInicio)||b.numero-a.numero);
  if(ui.mejorasFiltroProceso!=='all') list=list.filter(m=>m.proceso===ui.mejorasFiltroProceso);
  if(ui.mejorasFiltroPilar!=='all') list=list.filter(m=>ui.mejorasFiltroPilar==='general'?!m.pilar:m.pilar===ui.mejorasFiltroPilar);
  if(!list.length) return '<div class="empty">Sin mejoras en '+monthLabel(mk)+' con estos filtros.</div>';
  return '<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Proceso</th><th>Propuesta</th><th>Líder</th><th>Pilar</th><th></th></tr></thead><tbody>'+
    list.map(m=>`<tr>
      <td class="small">${m.fechaInicio}</td>
      <td class="small">${esc(m.proceso)}</td>
      <td style="max-width:230px;">${esc(m.propuesta)}</td>
      <td class="small muted">${esc(m.lider)}${m.equipo?' · '+esc(m.equipo):''}</td>
      <td><select data-mejora-pilar="${m.id}" style="font-size:11px;padding:4px 6px;">${mejoraPilarOptions(m.pilar||'')}</select></td>
      <td>${deleteBtnHtml('mejora',m.id,'Eliminar')}</td>
    </tr>`).join('')+'</tbody></table></div>';
}

function bindMesEvents(){

  });
  const btnPrev = document.getElementById('btnMesPrev');
  const btnNext = document.getElementById('btnMesNext');
  const btnPrint = document.getElementById('btnImprimir');
  if(btnPrev) btnPrev.addEventListener('click', async ()=>{ ui.mes = addMonths(ui.mes,-1); await loadMonth(ui.mes); renderViewport(); });
  if(btnNext) btnNext.addEventListener('click', async ()=>{ ui.mes = addMonths(ui.mes,1); await loadMonth(ui.mes); renderViewport(); });
  if(btnPrint) btnPrint.addEventListener('click', ()=>window.print());

  document.querySelectorAll('[data-pilar-mes-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const pid = el.dataset.pilarMesToggle;
      ui.pilarMesExpandido = (ui.pilarMesExpandido===pid)? null : pid;
      ui.semaforoFiltro = null;
      ui.objetivoExpandido = null;
      renderViewport();
    });
  });
  document.querySelectorAll('[data-semaforo-filtro]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.semaforoFiltro;
      ui.semaforoFiltro = (ui.semaforoFiltro===k)? null : k;
      renderViewport();
    });
  });
  document.querySelectorAll('[data-objetivo-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.dataset.objetivoToggle);
      ui.objetivoExpandido = (ui.objetivoExpandido===id)? null : id;
      renderViewport();
    });
  });
  document.querySelectorAll('[data-nuevo-ind-pilar]').forEach(el=>{
    el.addEventListener('click', ()=>{ ui.indNewOpen=!ui.indNewOpen; ui.indNewOpenPilar=el.dataset.nuevoIndPilar; ui.indFormError=''; renderViewport(); });
  });
  bindIndicadoresTablaEvents();

  const btnNueva = document.getElementById('btnNuevaMejora');
  if(btnNueva) btnNueva.addEventListener('click', ()=>{ ui.mejorasNewOpen=!ui.mejorasNewOpen; ui.mejorasFormError=''; renderViewport(); });
  const btnGuardarM = document.getElementById('btnGuardarMejora');
  if(btnGuardarM) btnGuardarM.addEventListener('click', guardarNuevaMejora);
  const btnCancelarM = document.getElementById('btnCancelarMejora');
  if(btnCancelarM) btnCancelarM.addEventListener('click', ()=>{ ui.mejorasNewOpen=false; ui.mejorasFormError=''; renderViewport(); });
  const fp = document.getElementById('filtroMejoraProceso');
  if(fp) fp.addEventListener('change', ()=>{ ui.mejorasFiltroProceso=fp.value; renderViewport(); });
  const fplr = document.getElementById('filtroMejoraPilar');
  if(fplr) fplr.addEventListener('change', ()=>{ ui.mejorasFiltroPilar=fplr.value; renderViewport(); });
  document.querySelectorAll('[data-mejora-pilar]').forEach(el=>{
    el.addEventListener('change', ()=>actualizarMejoraPilar(el.dataset.mejoraPilar, el.value));
  });

  bindMapaEvents();
}

/* =========================================================

function renderTablaIndicadores(opts){
  opts = opts||{};
  const mk = opts.mk || ui.mes;
  let list = state.indicadores;
  if(opts.pilar) list = list.filter(i=>i.pilar===opts.pilar);
  if(!opts.compact && !opts.pilar){
    if(ui.indFiltroPilar!=='all') list = list.filter(i=>i.pilar===ui.indFiltroPilar);
    if(ui.indFiltroEstado!=='all') list = list.filter(i=>{
      if(ui.indFiltroEstado==='rojo'||ui.indFiltroEstado==='verde'||ui.indFiltroEstado==='ambar') return semaforo(i,mk)===ui.indFiltroEstado;
      return i.estado===ui.indFiltroEstado;
    });
  }
  if(opts.pilar){
    return `<div class="tbl-wrap"><table>
      <thead><tr><th>Objetivo táctico</th><th>KPI</th><th>Meta</th><th>Real (${monthLabel(mk).split(' ')[0]})</th><th>%</th><th>vs. mes ant.</th><th>Estado</th></tr></thead>
      <tbody>${list.map(i=>renderIndicadorFilas(i,{...opts,mk})).join('') || '<tr><td colspan="7" class="empty">Sin indicadores en este pilar.</td></tr>'}</tbody>
    </table></div>`;
  }
  const byPilar = {};
  list.forEach(i=>{ (byPilar[i.pilar]=byPilar[i.pilar]||[]).push(i); });
  const pilarIds = state.pilares.map(p=>p.id).filter(pid=>byPilar[pid]);
  return pilarIds.map(pid=>{
    const p = getPilar(pid);
    const items = byPilar[pid];
    return `
    <div style="margin-top:${opts.compact?'10px':'18px'};">
      <div class="small" style="font-weight:700;color:var(--dark-blue);margin-bottom:6px;">${esc(p.id)} · ${esc(p.nombre)}</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Objetivo táctico</th><th>KPI</th><th>Meta</th><th>Real</th><th>%</th><th>Estado</th></tr></thead>
          <tbody>
            ${items.map(i=>renderIndicadorFilas(i, {...opts,mk})).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('') || '<div class="empty">No hay indicadores con estos filtros.</div>';
}

function renderIndicadorFilas(i, opts){
  const mk = opts.mk || ui.mes;
  const s = semaforo(i, mk);
  const pct = pctCumplimiento(i, mk);
  const prevMk = addMonths(mk, -1);
  const pctPrev = pctCumplimiento(i, prevMk);
  const puedeEditar = !opts.compact;
  const puedeDefinir = puedeEditar && (i.estado==='sin_definir' || i.estado==='revisar');
  const puedeConfirmar = puedeEditar && i.estado==='borrador';
  const editando = puedeEditar && ui.indEditingId===i.id;
  const realActual = getRealMes(i, mk);

  let delta = '<span class="muted">—</span>';
  if(pct!=null && pctPrev!=null){
    const d = Math.round(pct-pctPrev);
    const arrow = d>0?'▲':(d<0?'▼':'●');
    const color = d>0?'var(--verde)':(d<0?'var(--rojo)':'var(--text-3)');
    delta = `<span style="color:${color};font-weight:700;">${arrow} ${Math.abs(d)} pts</span>`;
  } else if(pct!=null && pctPrev==null){
    delta = '<span class="small muted">sin dato previo</span>';
  }

  if(editando){
    return `<tr>
      <td colspan="7">
        <div class="card" style="background:var(--card-bg-2);margin:6px 0;padding:14px;">
          <div class="small muted" style="margin-bottom:8px;">${esc(i.objetivo)}${i.estado==='revisar'?' — el KPI actual no corresponde a este objetivo.':''}</div>
          <div class="grid grid-3">
            <div class="field"><label>KPI</label><input type="text" id="editKpi" value="${esc(i.kpi||'')}" placeholder="¿Qué se va a medir?"></div>
            <div class="field"><label>Meta</label><input type="number" id="editMeta" value="${i.meta??''}" step="any"></div>
            <div class="field"><label>Real (${monthLabel(mk).split(' ')[0]})</label><input type="number" id="editReal" value="${realActual??''}" step="any"></div>
          </div>
          <div class="row">
            <button class="btn btn-primary btn-sm" data-save-indicador="${i.id}" data-save-mk="${mk}">Guardar</button>
            <button class="btn btn-ghost btn-sm" data-cancel-indicador="${i.id}">Cancelar</button>
          </div>
        </div>
      </td>
    </tr>`;
  }

  const eo = estadoObjetivo(i, mk);
  const eoBadge = ESTADO_OBJETIVO_BADGE[eo];
  const barColorVar = eoBadge==='rojo'?'var(--rojo)':eoBadge==='ambar'?'var(--ambar)':eoBadge==='verde'?'var(--verde)':eoBadge==='naranja'?'var(--orange)':'var(--gris)';
  const barW = pct==null?0:clamp(pct,0,100);

  return `<tr>
    <td style="max-width:220px;">${esc(i.objetivo)}</td>
    <td class="small ${i.estado==='revisar'?'muted':''}">${i.kpi?esc(i.kpi):'<span class="muted">—</span>'}</td>
    <td>${(i.estado==='definido'||i.estado==='borrador')?`<input type="number" data-ind-meta="${i.id}" value="${i.meta}" step="any">`:'<span class="muted">—</span>'}</td>
    <td>${(i.estado==='definido'||i.estado==='borrador')?`<input type="number" data-ind-real-mes="${i.id}" data-real-mk="${mk}" value="${realActual??''}" step="any" placeholder="—">`:'<span class="muted">—</span>'}</td>
    <td>
      <div class="row" style="gap:6px;min-width:110px;">
        <div class="barwrap" style="height:8px;flex:1;"><div class="barfill" style="width:${barW}%;background:${barColorVar};"></div></div>
        <span class="small" style="min-width:32px;text-align:right;">${pct!=null?Math.round(pct)+'%':'—'}</span>
      </div>
    </td>
    <td class="small">${delta}</td>
    <td>
      <span class="badge badge-${eoBadge}">${ESTADO_OBJETIVO_LABEL[eo]}</span>
      ${puedeDefinir? `<button class="btn btn-ghost btn-sm" data-edit-indicador="${i.id}" style="margin-left:6px;">${i.estado==='revisar'?'Corregir':'Definir'}</button>`:''}
      ${puedeConfirmar? `<button class="btn btn-ghost btn-sm" data-confirmar-indicador="${i.id}" style="margin-left:6px;">Confirmar KPI</button>`:''}
      ${puedeEditar && i.nuevo? deleteBtnHtml('ind', i.id, 'Eliminar indicador'):''}
    </td>
  </tr>
  ${i.nota? `<tr><td colspan="7" class="small" style="color:var(--azul);padding-top:0;border-top:none;">${esc(i.nota)}</td></tr>`:''}
  `;
}

async function guardarEdicionIndicador(id, mk){
  const ind = state.indicadores.find(i=>i.id===Number(id));
  if(!ind) return;
  const kpi = document.getElementById('editKpi').value.trim();
  const metaVal = document.getElementById('editMeta').value;
  const realVal = document.getElementById('editReal').value;
  ind.kpi = kpi || null;
  ind.meta = metaVal===''? null : Number(metaVal);
  if(ind.kpi && ind.meta!=null){
    ind.estado = 'definido';
    ind.nota = null;
    ind.estandar = 'Meta institucional: '+ind.meta;
  } else {
    ind.estado = 'sin_definir';
    ind.nota = 'Objetivo táctico definido; medición pendiente.';
  }
  if(realVal!==''){
    await loadMonth(mk);
    if(!state.indicadorHist[mk]) state.indicadorHist[mk] = {};
    state.indicadorHist[mk][ind.id] = Number(realVal);
    await saveMonth(mk,'indhist');
  }
  ui.indEditingId = null;
  await saveIndicadores();
  renderViewport();
}
async function confirmarIndicador(id){
  const ind = state.indicadores.find(i=>i.id===Number(id));
  if(!ind) return;
  ind.estado = 'definido';
  ind.nota = null;
  await saveIndicadores();
  renderViewport();
}
async function eliminarIndicador(id){
  state.indicadores = state.indicadores.filter(i=>i.id!==Number(id));
  await saveIndicadores();
  renderViewport();
}

async function actualizarIndicador(id, field, value){
  const ind = state.indicadores.find(i=>i.id===Number(id));
  if(!ind) return;
  ind[field] = value===''? null : Number(value);
  await saveIndicadores();
  renderViewport();
}

async function guardarNuevoIndicador(){
  const pilar = document.getElementById('niPilar').value;
  const objetivo = document.getElementById('niObjetivo').value.trim();
  const kpi = document.getElementById('niKpi').value.trim();
  const metaVal = document.getElementById('niMeta').value;
  if(!pilar || !objetivo){ ui.indFormError='Necesitas al menos el pilar y el objetivo táctico.'; renderViewport(); return; }
  ui.indFormError='';
  const nextId = state.indicadores.reduce((m,i)=>Math.max(m,i.id),0)+1;
  const definido = kpi && metaVal!=='';
  state.indicadores.push({
    id: nextId, pilar, objetivo, kpi: kpi||null,
    meta: definido? Number(metaVal):null,
    estandar: definido? 'Meta institucional: '+metaVal : null,
    estado: definido? 'definido':'sin_definir',
    nota: definido? null : 'Objetivo táctico definido; medición pendiente.',
    nuevo: true
  });
  ui.indNewOpen = false;
  ui.indNewOpenPilar = null;
  await saveIndicadores();
  renderViewport();
}

function bindIndicadoresTablaEvents(){
  document.querySelectorAll('[data-ind-meta]').forEach(el=>{
    el.addEventListener('change', ()=>actualizarIndicador(el.dataset.indMeta,'meta',el.value));
  });
  document.querySelectorAll('[data-ind-real-mes]').forEach(el=>{
    el.addEventListener('change', ()=>actualizarRealMes(el.dataset.indRealMes, el.dataset.realMk, el.value));
  });
  document.querySelectorAll('[data-edit-indicador]').forEach(el=>{
    el.addEventListener('click', ()=>{ ui.indEditingId = Number(el.dataset.editIndicador); renderViewport(); });
  });
  document.querySelectorAll('[data-cancel-indicador]').forEach(el=>{
    el.addEventListener('click', ()=>{ ui.indEditingId = null; renderViewport(); });
  });
  document.querySelectorAll('[data-save-indicador]').forEach(el=>{
    el.addEventListener('click', ()=>guardarEdicionIndicador(el.dataset.saveIndicador, el.dataset.saveMk));
  });
  document.querySelectorAll('[data-confirmar-indicador]').forEach(el=>{
    el.addEventListener('click', ()=>confirmarIndicador(el.dataset.confirmarIndicador));
  });
  const btnNuevo = document.getElementById('btnNuevoIndicador');
  if(btnNuevo) btnNuevo.addEventListener('click', ()=>{ ui.indNewOpen = !ui.indNewOpen; ui.indFormError=''; renderViewport(); });
  const btnGuardarNuevo = document.getElementById('btnGuardarNuevoIndicador');
  if(btnGuardarNuevo) btnGuardarNuevo.addEventListener('click', guardarNuevoIndicador);
  const btnCancelarNuevo = document.getElementById('btnCancelarNuevoIndicador');
  if(btnCancelarNuevo) btnCancelarNuevo.addEventListener('click', ()=>{ ui.indNewOpen=false; ui.indNewOpenPilar=null; ui.indFormError=''; renderViewport(); });
}

/* =========================================================
   MEJORAS 1% — cómputo
   ========================================================= */
function mejorasDelMes(mk){
  return state.mejoras.filter(m=>monthKey(parseISO(m.fechaInicio))===mk);
}
function resumenMejorasPorProceso(list){
  const out = {};
  PROCESOS_MEJORA.forEach(p=>{ out[p]=0; });
  list.forEach(m=>{ out[m.proceso]=(out[m.proceso]||0)+1; });
  return out;
}
function siguienteNumeroMejora(){
  return state.mejoras.reduce((max,m)=>Math.max(max,m.numero||0),0)+1;
}

}

async function guardarNuevaMejora(){
  const propuesta = document.getElementById('mjPropuesta').value.trim();
  const proceso = document.getElementById('mjProceso').value;
  const pilar = document.getElementById('mjPilar').value || null;
  const semana = Number(document.getElementById('mjSemana').value)||1;
  const fechaInicio = document.getElementById('mjFecha').value;
  const dias = Number(document.getElementById('mjDias').value)||0;
  const lider = document.getElementById('mjLider').value.trim() || 'Ceci';
  const equipo = document.getElementById('mjEquipo').value.trim() || null;
  if(!propuesta){ ui.mejorasFormError='Escribe en qué consiste la mejora.'; renderViewport(); return; }
  if(!fechaInicio){ ui.mejorasFormError='Elige una fecha de inicio.'; renderViewport(); return; }
  ui.mejorasFormError='';
  const numero = siguienteNumeroMejora();
  state.mejoras.push({
    id: uid('mj'), numero, semana,
    fechaInicio, dias, lider, equipo, area:'UGEB', proceso, pilar, propuesta, nuevo:true
  });

  ui.mejorasNewOpen = false;

}
async function eliminarMejora(id){
  state.mejoras = state.mejoras.filter(m=>m.id!==id);
  await saveMejoras();
  renderViewport();
}
async function actualizarMejoraPilar(id, pilar){
  const m = state.mejoras.find(x=>x.id===id);
  if(!m) return;
  m.pilar = pilar || null;
  await saveMejoras();
  renderViewport();
}

/* =========================================================
   VISTA MAPA — elemento firma
   ========================================================= */
function polarPoint(cx,cy,r,angleDeg){
  const a = (angleDeg-90)*Math.PI/180;
  return {x: cx+r*Math.cos(a), y: cy+r*Math.sin(a)};
}
function svgWrapLines(label, maxChars){
  const words = String(label).split(' ');
  const lines = []; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length>maxChars && cur){ lines.push(cur.trim()); cur=w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}
function svgNodeText(label, x, y){
  const lines = svgWrapLines(label,13);
  const startDy = -((lines.length-1)*11)/2;
  return `<text x="${x}" y="${y+startDy}">${lines.map((l,i)=>`<tspan x="${x}" dy="${i===0?0:11}">${esc(l)}</tspan>`).join('')}</text>`;
}
function pilaresRelacionados(ventajaId){
  return state.pilares.filter(p=> p.ventajaPrimaria===ventajaId || (p.secundarias||[]).includes(ventajaId));
}
function ventajasRelacionadas(pilarId){
  const p = getPilar(pilarId); if(!p) return [];
  return [p.ventajaPrimaria, ...(p.secundarias||[])].filter(v=>v!=null);
}

function buildCircleSVG({centerLabel, centerSub, nodes, nodeClass, size}){
  size = size||480;
  const cx=size/2, cy=size/2, rCenter=64, rOrbit=size/2-64, rNode=44;
  let svg = `<svg viewBox="0 0 ${size} ${size}" class="mapa-svg" xmlns="http://www.w3.org/2000/svg">`;
  nodes.forEach((n,i)=>{
    const angle = (360/nodes.length)*i;
    const p = polarPoint(cx,cy,rOrbit,angle);
    svg += `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" class="mapa-line ${n.highlighted?'active':''}" stroke-dasharray="4 5"/>`;
  });
  svg += `<g class="mapa-center"><circle cx="${cx}" cy="${cy}" r="${rCenter}"/>`;
  svg += `<text x="${cx}" y="${cy-4}">${esc(centerLabel)}</text>`;
  if(centerSub) svg += `<text x="${cx}" y="${cy+14}" class="sub">${esc(centerSub)}</text>`;
  svg += `</g>`;
  nodes.forEach((n,i)=>{
    const angle = (360/nodes.length)*i;
    const p = polarPoint(cx,cy,rOrbit,angle);
    const styleAttr = n.color ? ` style="--node-color:${n.color};"` : '';
    svg += `<g class="mapa-node ${nodeClass} ${n.highlighted?'active':''} ${n.special?'p8':''}" data-node-id="${esc(String(n.id))}" tabindex="0" role="button" aria-pressed="${!!n.highlighted}"${styleAttr}>`;
    svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rNode}"/>`;
    svg += svgNodeText(n.label, p.x, p.y);
    svg += `</g>`;
  });
  svg += `</svg>`;
  return svg;
}

function renderMapaContent(){
  const selV = ui.mapaSel.ventaja, selP = ui.mapaSel.pilar;
  const highlightedPilares = selV!=null ? pilaresRelacionados(selV).map(p=>p.id) : (selP? [selP]:[]);

  const nodesPilares = state.pilares.map(p=>({id:p.id, label:p.nombre.split(' – ')[0], highlighted:highlightedPilares.includes(p.id), special:p.id==='P8', color:pilarColorVar(p.id)}));
  const svgPilares = buildCircleSVG({centerLabel:'Eje 3', centerSub:'Movilidad Social', nodes:nodesPilares, nodeClass:'pilar'});

  let sidePanel = '<p class="muted small">Haz clic en un pilar para ver con qué ventaja competitiva se conecta.</p>';
  if(selP){
    const p = getPilar(selP);
    const vs = ventajasRelacionadas(selP).map(id=>getVentaja(id)).filter(Boolean);
    const inds = state.indicadores.filter(i=>i.pilar===selP);
    sidePanel = `
      <div class="small muted">Pilar seleccionado</div>
      <div style="font-weight:700;font-size:16px;margin-bottom:8px;">${p.id} · ${esc(p.nombre)}</div>
      <div class="row" style="flex-wrap:wrap;gap:8px;">
        ${vs.map(v=>`<span class="chip">${esc(v.nombre)}</span>`).join('')}
      </div>
      ${p.subetiquetas? `<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px;">${p.subetiquetas.map(s=>`<span class="tag tag-nueva">${esc(s)}</span>`).join('')}</div>`:''}
      <p class="small muted" style="margin-top:10px;">${inds.length} indicadores · ${actividadesDe(selP).length} actividades observables.</p>`;
  }

  return `
  <div class="card">
    ${svgPilares}
  </div>
  <div class="card mapa-side">${sidePanel}</div>

  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="gradViolet" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#5B4FD6"/><stop offset="100%" stop-color="#3B2E8F"/>
      </linearGradient>
      <linearGradient id="gradGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#E3C468"/><stop offset="100%" stop-color="#B8912F"/>
      </linearGradient>
      <linearGradient id="gradTeal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#57C9A0"/><stop offset="100%" stop-color="#2FA37A"/>
      </linearGradient>
    </defs>
  </svg>
  `;
}

function bindMapaEvents(){
  document.querySelectorAll('.mapa-node').forEach(el=>{
    const activate = ()=>{
      const id = el.dataset.nodeId;
      const isPilar = el.classList.contains('pilar');
      if(isPilar){
        ui.mapaSel.pilar = (ui.mapaSel.pilar===id)? null : id;
        ui.mapaSel.ventaja = null;
      } else {
        const numId = Number(id);
        ui.mapaSel.ventaja = (ui.mapaSel.ventaja===numId)? null : numId;
        ui.mapaSel.pilar = null;
      }
      renderViewport();
    };
    el.addEventListener('click', activate);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); activate(); }});
  });
}

/* =========================================================
   EXPORTAR / IMPORTAR — red de seguridad
   ========================================================= */
async function exportarJSON(){
  const meses = state.config.meses.length? state.config.meses : [ui.mes];
  const bitacora = {}, unopct = {}, cierre = {}, indhist = {};
  for(const mk of meses){
    try{ bitacora[mk] = await storeGet('bitacora:'+mk); }catch(e){ bitacora[mk] = state.bitacora[mk] || {tareas:[]}; }
    try{ unopct[mk] = await storeGet('unopct:'+mk); }catch(e){ unopct[mk] = state.unopct[mk] || {archivos:[]}; }
    try{ cierre[mk] = await storeGet('cierre:'+mk); }catch(e){ cierre[mk] = state.cierre[mk] || {narrativa:''}; }
    try{ indhist[mk] = await storeGet('indhist:'+mk); }catch(e){ indhist[mk] = state.indicadorHist[mk] || {}; }
  }
  const payload = {
    exportado: new Date().toISOString(),
    ventajas: state.ventajas, pilares: state.pilares,
    actividades: state.actividades, indicadores: state.indicadores, mejoras: state.mejoras,
    config: state.config, bitacora, unopct, cierre, indicadorHist: indhist
  };
  downloadFile('tablero-movilidad-social-'+isoDate(new Date())+'.json', JSON.stringify(payload,null,2));
}

async function importarJSON(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(data.ventajas) state.ventajas = data.ventajas;
    if(data.pilares) state.pilares = data.pilares;
    if(data.actividades) state.actividades = data.actividades;
    if(data.indicadores) state.indicadores = data.indicadores;
    if(data.mejoras) state.mejoras = data.mejoras;
    if(data.config) state.config = data.config;
    if(data.bitacora) state.bitacora = data.bitacora;
    if(data.unopct) state.unopct = data.unopct;
    if(data.cierre) state.cierre = data.cierre;
    if(data.indicadorHist) state.indicadorHist = data.indicadorHist;
    const meses = new Set(state.config.meses||[]);
    Object.keys(state.bitacora).forEach(mk=>meses.add(mk));
    Object.keys(state.unopct).forEach(mk=>meses.add(mk));
    Object.keys(state.cierre).forEach(mk=>meses.add(mk));
    Object.keys(state.indicadorHist).forEach(mk=>meses.add(mk));
    state.config.meses = Array.from(meses).sort();
    // persistir todo de vuelta
    await storeSet('catalogo:ventajas', state.ventajas);
    await storeSet('catalogo:pilares', state.pilares);
    await storeSet('catalogo:actividades', state.actividades);
    await storeSet('catalogo:indicadores', state.indicadores);
    await storeSet('mejoras', state.mejoras);
    await storeSet('config', state.config);
    for(const mk of state.config.meses){
      if(state.bitacora[mk]) await storeSet('bitacora:'+mk, state.bitacora[mk]);
      if(state.unopct[mk]) await storeSet('unopct:'+mk, state.unopct[mk]);
      if(state.cierre[mk]) await storeSet('cierre:'+mk, state.cierre[mk]);
      if(state.indicadorHist[mk]) await storeSet('indhist:'+mk, state.indicadorHist[mk]);
    }
    showToast('Importación completa. El tablero se actualizó con los datos del archivo.');
    await render();
  }catch(e){
    console.error(e);
    showToast('No se pudo leer ese archivo. Verifica que sea un JSON exportado desde este tablero.', true);
  }
}

document.getElementById('importInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importarJSON(file);
  e.target.value = '';
});
